<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 1400">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text{font-family:'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif}.title{fill:#f8fafc;font-size:22px;font-weight:700}.sub{fill:#94a3b8;font-size:11px}.region{font-size:10px;font-weight:600}.entity{fill:#f8fafc;font-size:12px;font-weight:700;text-anchor:middle}.field{fill:#cbd5e1;font-size:8.5px}.pk{fill:#fbbf24;font-weight:600}.fk{fill:#60a5fa;font-weight:600}.card{fill:#94a3b8;font-size:8px}.note{fill:#cbd5e1;font-size:9px}
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0L0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
    <marker id="one" markerWidth="10" markerHeight="12" refX="8" refY="6" orient="auto"><path d="M3 1V11M7 1V11" stroke="#94a3b8" stroke-width="1.2"/></marker>
    <marker id="many" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto"><path d="M1 7L13 1M1 7L13 7M1 7L13 13" stroke="#94a3b8" stroke-width="1.2" fill="none"/></marker>
  </defs>
  <rect width="1700" height="1400" fill="#0f172a"/><rect width="1700" height="1400" fill="url(#grid)"/>
  <text x="34" y="40" class="title">AI Image Community — PostgreSQL ER Diagram</text>
  <text x="34" y="62" class="sub">Phase 2 · ai schema · Tencent COS as default object storage · public.users remains the identity source</text>

  <rect x="25" y="82" width="1650" height="225" rx="12" fill="none" stroke="#22d3ee" stroke-dasharray="8,4"/><text x="40" y="101" fill="#22d3ee" class="region">IDENTITY · WORKFLOW · PROVIDER</text>
  <rect x="25" y="327" width="1650" height="305" rx="12" fill="none" stroke="#fb923c" stroke-dasharray="8,4"/><text x="40" y="346" fill="#fb923c" class="region">GENERATION · RELIABILITY · GOVERNANCE</text>
  <rect x="25" y="652" width="1650" height="305" rx="12" fill="none" stroke="#a78bfa" stroke-dasharray="8,4"/><text x="40" y="671" fill="#a78bfa" class="region">PERMANENT CONTENT · COS ASSETS · TAXONOMY</text>
  <rect x="25" y="977" width="1650" height="260" rx="12" fill="none" stroke="#34d399" stroke-dasharray="8,4"/><text x="40" y="996" fill="#34d399" class="region">COMMUNITY INTERACTIONS</text>

  <!-- Relationships, rendered behind entities -->
  <path d="M600 195H660" stroke="#94a3b8" fill="none" marker-start="url(#one)" marker-end="url(#many)"/><path d="M910 195H970" stroke="#94a3b8" fill="none" marker-start="url(#one)" marker-end="url(#many)"/><path d="M1220 195H1280" stroke="#94a3b8" fill="none" marker-start="url(#many)" marker-end="url(#one)"/>
  <path d="M785 285V320H600V375" stroke="#64748b" fill="none" marker-start="url(#one)" marker-end="url(#many)"/>
  <path d="M1095 285V315H785V375" stroke="#64748b" fill="none" marker-start="url(#one)" marker-end="url(#many)"/>
  <path d="M1405 285V305H800V375" stroke="#64748b" fill="none" marker-start="url(#one)" marker-end="url(#many)"/>
  <path d="M290 195H315V465H350" stroke="#64748b" fill="none" marker-start="url(#one)" marker-end="url(#many)"/>
  <path d="M600 465H660" stroke="#fb923c" fill="none" marker-start="url(#one)" marker-end="url(#many)"/>
  <path d="M600 490H945V465H970" stroke="#fb7185" fill="none" marker-start="url(#one)" marker-end="url(#many)"/>
  <path d="M600 515H1255V465H1280" stroke="#fb923c" stroke-dasharray="5,4" fill="none" marker-end="url(#many)"/>
  <path d="M475 555V700" stroke="#a78bfa" fill="none" marker-start="url(#one)" marker-end="url(#many)"/>
  <path d="M785 555V625H600V740" stroke="#a78bfa" fill="none" marker-start="url(#one)" marker-end="url(#many)"/>
  <path d="M1095 555V625H520V700" stroke="#fb7185" fill="none" marker-end="url(#many)"/>
  <path d="M600 790H660" stroke="#a78bfa" fill="none" marker-start="url(#one)" marker-end="url(#many)"/>
  <path d="M600 820H970" stroke="#a78bfa" fill="none" marker-start="url(#one)" marker-end="url(#many)"/>
  <path d="M1220 790H1280" stroke="#a78bfa" fill="none" marker-start="url(#many)" marker-end="url(#one)"/>
  <path d="M475 880V955H345V1030" stroke="#34d399" fill="none" marker-start="url(#one)" marker-end="url(#many)"/><path d="M475 955H645V1030" stroke="#34d399" fill="none" marker-end="url(#many)"/><path d="M475 955H945V1030" stroke="#34d399" fill="none" marker-end="url(#many)"/><path d="M475 955H1245V1030" stroke="#34d399" fill="none" marker-end="url(#many)"/>

  <!-- Row 1 entities -->
  <g transform="translate(40,120)"><rect width="250" height="165" rx="7" fill="#0f172a"/><rect width="250" height="165" rx="7" fill="rgba(8,51,68,.4)" stroke="#22d3ee" stroke-width="1.5"/><text x="125" y="24" class="entity">public.users</text><line x1="0" y1="36" x2="250" y2="36" stroke="#22d3ee" opacity=".5"/><text x="12" y="55" class="field pk">PK id : integer</text><text x="12" y="73" class="field">email : varchar UNIQUE</text><text x="12" y="91" class="field">is_admin : boolean</text><text x="12" y="109" class="field">plan : varchar</text><text x="12" y="127" class="field">is_active_user : boolean</text><text x="12" y="145" class="field">created_at : timestamp</text></g>
  <g transform="translate(350,120)"><rect width="250" height="165" rx="7" fill="#0f172a"/><rect width="250" height="165" rx="7" fill="rgba(6,78,59,.4)" stroke="#34d399" stroke-width="1.5"/><text x="125" y="24" class="entity">workflows</text><line x1="0" y1="36" x2="250" y2="36" stroke="#34d399" opacity=".5"/><text x="12" y="55" class="field pk">PK id : uuid</text><text x="12" y="73" class="field">slug : varchar UNIQUE</text><text x="12" y="91" class="field">name / category</text><text x="12" y="109" class="field">is_enabled / sort_order</text><text x="12" y="127" class="field fk">FK created_by_user_id</text><text x="12" y="145" class="field">created_at / updated_at</text></g>
  <g transform="translate(660,120)"><rect width="250" height="165" rx="7" fill="#0f172a"/><rect width="250" height="165" rx="7" fill="rgba(6,78,59,.4)" stroke="#34d399" stroke-width="1.5"/><text x="125" y="24" class="entity">workflow_versions</text><line x1="0" y1="36" x2="250" y2="36" stroke="#34d399" opacity=".5"/><text x="12" y="55" class="field pk">PK id : uuid</text><text x="12" y="73" class="field fk">FK workflow_id</text><text x="12" y="91" class="field">version : integer</text><text x="12" y="109" class="field">input_schema / defaults : jsonb</text><text x="12" y="127" class="field">output_schema : jsonb</text><text x="12" y="145" class="field">is_active : boolean</text></g>
  <g transform="translate(970,120)"><rect width="250" height="165" rx="7" fill="#0f172a"/><rect width="250" height="165" rx="7" fill="rgba(120,53,15,.3)" stroke="#fbbf24" stroke-width="1.5"/><text x="125" y="24" class="entity">workflow_provider_bindings</text><line x1="0" y1="36" x2="250" y2="36" stroke="#fbbf24" opacity=".5"/><text x="12" y="55" class="field pk">PK id : uuid</text><text x="12" y="73" class="field fk">FK workflow_version_id</text><text x="12" y="91" class="field fk">FK provider_id</text><text x="12" y="109" class="field">provider_workflow_ref / model</text><text x="12" y="127" class="field">timeout / max_attempts / priority</text><text x="12" y="145" class="field">provider_config : jsonb</text></g>
  <g transform="translate(1280,120)"><rect width="250" height="165" rx="7" fill="#0f172a"/><rect width="250" height="165" rx="7" fill="rgba(120,53,15,.3)" stroke="#fbbf24" stroke-width="1.5"/><text x="125" y="24" class="entity">providers</text><line x1="0" y1="36" x2="250" y2="36" stroke="#fbbf24" opacity=".5"/><text x="12" y="55" class="field pk">PK id : uuid</text><text x="12" y="73" class="field">code : varchar UNIQUE</text><text x="12" y="91" class="field">adapter_type / status / priority</text><text x="12" y="109" class="field">base_url / secret_ref</text><text x="12" y="127" class="field">capabilities / config : jsonb</text><text x="12" y="145" class="field">health / cost_config</text></g>

  <!-- Row 2 entities -->
  <g transform="translate(40,375)"><rect width="250" height="180" rx="7" fill="#0f172a"/><rect width="250" height="180" rx="7" fill="rgba(30,41,59,.5)" stroke="#94a3b8" stroke-width="1.5"/><text x="125" y="24" class="entity">audit_logs</text><line x1="0" y1="36" x2="250" y2="36" stroke="#94a3b8" opacity=".5"/><text x="12" y="55" class="field pk">PK id : bigint identity</text><text x="12" y="73" class="field fk">FK actor_user_id</text><text x="12" y="91" class="field">actor_type / action</text><text x="12" y="109" class="field">resource_type / resource_id</text><text x="12" y="127" class="field">request_id / metadata</text><text x="12" y="145" class="field">ip_hash</text><text x="12" y="163" class="field">created_at</text></g>
  <g transform="translate(350,375)"><rect width="250" height="180" rx="7" fill="#0f172a"/><rect width="250" height="180" rx="7" fill="rgba(251,146,60,.3)" stroke="#fb923c" stroke-width="1.5"/><text x="125" y="24" class="entity">generation_jobs</text><line x1="0" y1="36" x2="250" y2="36" stroke="#fb923c" opacity=".5"/><text x="12" y="55" class="field pk">PK id : uuid</text><text x="12" y="73" class="field fk">FK user_id / workflow_version_id</text><text x="12" y="91" class="field fk">FK selected_provider_id</text><text x="12" y="109" class="field">status / idempotency_key</text><text x="12" y="127" class="field">prompt / negative_prompt / params</text><text x="12" y="145" class="field">visibility / prompt_visibility</text><text x="12" y="163" class="field">cost / credits / timestamps</text></g>
  <g transform="translate(660,375)"><rect width="250" height="180" rx="7" fill="#0f172a"/><rect width="250" height="180" rx="7" fill="rgba(251,146,60,.3)" stroke="#fb923c" stroke-width="1.5"/><text x="125" y="24" class="entity">generation_attempts</text><line x1="0" y1="36" x2="250" y2="36" stroke="#fb923c" opacity=".5"/><text x="12" y="55" class="field pk">PK id : uuid</text><text x="12" y="73" class="field fk">FK job_id / provider_id / binding_id</text><text x="12" y="91" class="field">attempt_no / status</text><text x="12" y="109" class="field">external_request_id / model</text><text x="12" y="127" class="field">request / response snapshot</text><text x="12" y="145" class="field">error class / retryable</text><text x="12" y="163" class="field">cost / timestamps</text></g>
  <g transform="translate(970,375)"><rect width="250" height="180" rx="7" fill="#0f172a"/><rect width="250" height="180" rx="7" fill="rgba(136,19,55,.4)" stroke="#fb7185" stroke-width="1.5"/><text x="125" y="24" class="entity">moderation_events</text><line x1="0" y1="36" x2="250" y2="36" stroke="#fb7185" opacity=".5"/><text x="12" y="55" class="field pk">PK id : uuid</text><text x="12" y="73" class="field fk">FK job_id / image_id</text><text x="12" y="91" class="field">stage : prompt | image | manual</text><text x="12" y="109" class="field">provider / decision</text><text x="12" y="127" class="field">reason_codes / details : jsonb</text><text x="12" y="145" class="field fk">FK reviewer_user_id</text><text x="12" y="163" class="field">created_at</text></g>
  <g transform="translate(1280,375)"><rect width="250" height="180" rx="7" fill="#0f172a"/><rect width="250" height="180" rx="7" fill="rgba(251,146,60,.3)" stroke="#fb923c" stroke-width="1.5"/><text x="125" y="24" class="entity">outbox_events</text><line x1="0" y1="36" x2="250" y2="36" stroke="#fb923c" opacity=".5"/><text x="12" y="55" class="field pk">PK id : uuid</text><text x="12" y="73" class="field">aggregate_type / aggregate_id</text><text x="12" y="91" class="field">event_type / payload</text><text x="12" y="109" class="field">attempts / available_at</text><text x="12" y="127" class="field">published_at / last_error</text><text x="12" y="145" class="field">created_at</text><text x="12" y="163" class="field">INDEX pending events only</text></g>

  <!-- Row 3 entities -->
  <g transform="translate(40,700)"><rect width="250" height="180" rx="7" fill="#0f172a"/><rect width="250" height="180" rx="7" fill="rgba(30,41,59,.5)" stroke="#94a3b8" stroke-width="1.5"/><text x="125" y="24" class="entity">system_settings</text><line x1="0" y1="36" x2="250" y2="36" stroke="#94a3b8" opacity=".5"/><text x="12" y="55" class="field pk">PK key : varchar</text><text x="12" y="73" class="field">value : jsonb</text><text x="12" y="91" class="field">description</text><text x="12" y="109" class="field">secret_ref</text><text x="12" y="127" class="field fk">FK updated_by_user_id</text><text x="12" y="145" class="field">created_at / updated_at</text></g>
  <g transform="translate(350,700)"><rect width="250" height="180" rx="7" fill="#0f172a"/><rect width="250" height="180" rx="7" fill="rgba(76,29,149,.4)" stroke="#a78bfa" stroke-width="1.8"/><text x="125" y="24" class="entity">images</text><line x1="0" y1="36" x2="250" y2="36" stroke="#a78bfa" opacity=".5"/><text x="12" y="55" class="field pk">PK id : uuid</text><text x="12" y="73" class="field fk">FK job / attempt / creator</text><text x="12" y="91" class="field fk">FK provider / workflow_version</text><text x="12" y="109" class="field">slug / title / immutable snapshots</text><text x="12" y="127" class="field">dimensions / seed / sampler / cfg</text><text x="12" y="145" class="field">privacy / moderation / counters</text><text x="12" y="163" class="field">published_at / deleted_at</text></g>
  <g transform="translate(660,700)"><rect width="250" height="180" rx="7" fill="#0f172a"/><rect width="250" height="180" rx="7" fill="rgba(76,29,149,.4)" stroke="#a78bfa" stroke-width="1.5"/><text x="125" y="24" class="entity">image_assets</text><line x1="0" y1="36" x2="250" y2="36" stroke="#a78bfa" opacity=".5"/><text x="12" y="55" class="field pk">PK id : uuid</text><text x="12" y="73" class="field fk">FK image_id</text><text x="12" y="91" class="field">variant : original | preview | thumb</text><text x="12" y="109" class="field">storage_provider = tencent_cos</text><text x="12" y="127" class="field">bucket / region / object_key</text><text x="12" y="145" class="field">public_url / mime / dimensions</text><text x="12" y="163" class="field">byte_size / sha256</text></g>
  <g transform="translate(970,700)"><rect width="250" height="180" rx="7" fill="#0f172a"/><rect width="250" height="180" rx="7" fill="rgba(76,29,149,.4)" stroke="#a78bfa" stroke-width="1.5"/><text x="125" y="24" class="entity">image_tags</text><line x1="0" y1="36" x2="250" y2="36" stroke="#a78bfa" opacity=".5"/><text x="12" y="55" class="field pk">PK/FK image_id</text><text x="12" y="73" class="field pk">PK/FK tag_id</text><text x="12" y="91" class="field">created_at</text><text x="12" y="120" class="field">many-to-many join</text><text x="12" y="138" class="field">cascade on both parents</text></g>
  <g transform="translate(1280,700)"><rect width="250" height="180" rx="7" fill="#0f172a"/><rect width="250" height="180" rx="7" fill="rgba(76,29,149,.4)" stroke="#a78bfa" stroke-width="1.5"/><text x="125" y="24" class="entity">tags</text><line x1="0" y1="36" x2="250" y2="36" stroke="#a78bfa" opacity=".5"/><text x="12" y="55" class="field pk">PK id : uuid</text><text x="12" y="73" class="field">slug : varchar UNIQUE</text><text x="12" y="91" class="field">name : varchar UNIQUE</text><text x="12" y="109" class="field">created_at</text></g>

  <!-- Row 4 entities -->
  <g transform="translate(220,1030)"><rect width="250" height="160" rx="7" fill="#0f172a"/><rect width="250" height="160" rx="7" fill="rgba(6,78,59,.4)" stroke="#34d399" stroke-width="1.5"/><text x="125" y="24" class="entity">likes</text><line x1="0" y1="36" x2="250" y2="36" stroke="#34d399" opacity=".5"/><text x="12" y="58" class="field pk">PK/FK image_id</text><text x="12" y="78" class="field pk">PK/FK user_id</text><text x="12" y="98" class="field">created_at</text><text x="12" y="126" class="field">one like per user + image</text></g>
  <g transform="translate(520,1030)"><rect width="250" height="160" rx="7" fill="#0f172a"/><rect width="250" height="160" rx="7" fill="rgba(6,78,59,.4)" stroke="#34d399" stroke-width="1.5"/><text x="125" y="24" class="entity">favorites</text><line x1="0" y1="36" x2="250" y2="36" stroke="#34d399" opacity=".5"/><text x="12" y="58" class="field pk">PK/FK image_id</text><text x="12" y="78" class="field pk">PK/FK user_id</text><text x="12" y="98" class="field">created_at</text><text x="12" y="126" class="field">one favorite per user + image</text></g>
  <g transform="translate(820,1030)"><rect width="250" height="160" rx="7" fill="#0f172a"/><rect width="250" height="160" rx="7" fill="rgba(6,78,59,.4)" stroke="#34d399" stroke-width="1.5"/><text x="125" y="24" class="entity">comments</text><line x1="0" y1="36" x2="250" y2="36" stroke="#34d399" opacity=".5"/><text x="12" y="58" class="field pk">PK id : uuid</text><text x="12" y="78" class="field fk">FK image_id / user_id / parent_id</text><text x="12" y="98" class="field">body / moderation_status</text><text x="12" y="118" class="field">deleted_at</text><text x="12" y="138" class="field">created_at / updated_at</text></g>
  <g transform="translate(1120,1030)"><rect width="250" height="160" rx="7" fill="#0f172a"/><rect width="250" height="160" rx="7" fill="rgba(6,78,59,.4)" stroke="#34d399" stroke-width="1.5"/><text x="125" y="24" class="entity">download_logs</text><line x1="0" y1="36" x2="250" y2="36" stroke="#34d399" opacity=".5"/><text x="12" y="58" class="field pk">PK id : bigint identity</text><text x="12" y="78" class="field fk">FK image_id / user_id / asset_id</text><text x="12" y="98" class="field">ip_hash / user_agent_hash</text><text x="12" y="118" class="field">created_at</text></g>

  <rect x="45" y="1260" width="1610" height="105" rx="9" fill="rgba(30,41,59,.65)" stroke="#64748b"/>
  <text x="68" y="1286" class="note"><tspan class="pk">PK</tspan><tspan> = primary key   </tspan><tspan class="fk">FK</tspan><tspan> = foreign key   |   1 → many uses crow's-foot markers</tspan></text>
  <text x="68" y="1312" class="note">Public Gallery invariant: visibility = public AND moderation_status = approved AND deleted_at IS NULL</text>
  <text x="68" y="1338" class="note">Secrets: database stores secret_ref only. Binary assets: Tencent COS by default; image_assets stores durable object identity and checksum.</text>
</svg>
