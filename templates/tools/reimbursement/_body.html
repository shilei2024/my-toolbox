<style>
  .rb-app { --ink:#172033; --muted:#697386; --line:#e6eaf0; --brand:#176b57; --brand-2:#e8f5f0; color:var(--ink); }
  .rb-shell { background:#f4f7f6; border:1px solid var(--line); border-radius:22px; overflow:hidden; min-height:760px; }
  .rb-topbar { padding:22px 26px; color:#fff; background:linear-gradient(125deg,#123f36,#176b57 58%,#25836d); position:relative; }
  .rb-topbar:after { content:""; position:absolute; right:-60px; top:-90px; width:260px; height:260px; border-radius:50%; background:rgba(255,255,255,.07); }
  .rb-topbar h2 { font-size:1.35rem; margin:0 0 5px; font-weight:700; letter-spacing:.02em; }
  .rb-topbar p { margin:0; color:rgba(255,255,255,.72); font-size:.86rem; }
  .rb-nav { display:flex; gap:6px; padding:0 20px; background:#fff; border-bottom:1px solid var(--line); overflow:auto; scrollbar-width:none; }
  .rb-nav::-webkit-scrollbar { display:none; }
  .rb-nav button { border:0; background:transparent; padding:15px 15px 12px; color:var(--muted); white-space:nowrap; border-bottom:3px solid transparent; font-weight:600; font-size:.86rem; }
  .rb-nav button.active { color:var(--brand); border-color:var(--brand); }
  .rb-main { padding:22px; }
  .rb-view { display:none; }
  .rb-view.active { display:block; }
  .rb-card { background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 8px 24px rgba(19,38,31,.045); }
  .rb-card-head { padding:16px 18px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .rb-card-head h3 { margin:0; font-size:1rem; font-weight:700; }
  .rb-card-body { padding:18px; }
  .rb-kpis { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; margin-bottom:18px; }
  .rb-kpi { padding:18px; background:#fff; border:1px solid var(--line); border-radius:16px; position:relative; overflow:hidden; }
  .rb-kpi:after { content:""; position:absolute; right:-16px; bottom:-25px; width:82px; height:82px; border-radius:50%; background:var(--brand-2); }
  .rb-kpi .label { color:var(--muted); font-size:.78rem; margin-bottom:7px; }
  .rb-kpi .value { font-size:1.55rem; font-weight:750; letter-spacing:-.03em; }
  .rb-grid-2 { display:grid; grid-template-columns:minmax(0,1.5fr) minmax(280px,.8fr); gap:16px; }
  .rb-active-period { padding:18px; background:linear-gradient(135deg,#ecf8f3,#fff); border:1px solid #cfe8de; border-radius:14px; }
  .rb-active-period .name { font-size:1.1rem; font-weight:700; color:var(--brand); }
  .rb-toolbar { display:flex; gap:9px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
  .rb-toolbar .form-control,.rb-toolbar .form-select { width:auto; min-width:145px; font-size:.84rem; }
  .rb-btn { border:1px solid transparent; border-radius:9px; padding:8px 12px; font-size:.82rem; font-weight:650; display:inline-flex; align-items:center; gap:6px; }
  .rb-btn-primary { background:var(--brand); color:#fff; }
  .rb-btn-primary:hover { background:#105846; color:#fff; }
  .rb-btn-light { background:#fff; border-color:var(--line); color:var(--ink); }
  .rb-btn-danger { background:#fff; border-color:#f1c6c7; color:#b42318; }
  .rb-table-wrap { overflow:auto; }
  .rb-table { width:100%; border-collapse:collapse; font-size:.82rem; }
  .rb-table th { color:#657083; background:#f8fafb; font-size:.75rem; font-weight:700; text-align:left; padding:11px 12px; border-bottom:1px solid var(--line); white-space:nowrap; }
  .rb-table td { padding:11px 12px; border-bottom:1px solid #edf0f3; vertical-align:middle; }
  .rb-table tr:last-child td { border-bottom:0; }
  .rb-empty { color:var(--muted); text-align:center; padding:38px 15px!important; }
  .rb-badge { display:inline-flex; align-items:center; gap:5px; padding:4px 8px; border-radius:999px; font-size:.72rem; font-weight:650; }
  .rb-status-pending { color:#8a5a00; background:#fff6dc; }
  .rb-status-approved { color:#176b57; background:#e8f5f0; }
  .rb-status-rejected { color:#a12622; background:#feeceb; }
  .rb-period-grid,.rb-category-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; }
  .rb-period-card,.rb-category-card { padding:17px; background:#fff; border:1px solid var(--line); border-radius:14px; }
  .rb-period-card.active { border-color:#76bda8; box-shadow:0 0 0 3px rgba(23,107,87,.08); }
  .rb-period-card .title,.rb-category-card .title { font-weight:700; margin-bottom:6px; }
  .rb-meta { color:var(--muted); font-size:.77rem; }
  .rb-card-actions { display:flex; gap:7px; margin-top:14px; flex-wrap:wrap; }
  .rb-color { width:10px; height:10px; border-radius:50%; display:inline-block; }
  .rb-summary-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; margin-bottom:16px; }
  .rb-summary-box { background:#f8faf9; border:1px solid var(--line); border-radius:12px; padding:14px; }
  .rb-summary-box small { color:var(--muted); }
  .rb-summary-box strong { display:block; font-size:1.25rem; margin-top:4px; }
  .rb-aux-tabs { display:flex; gap:7px; margin:18px 0 10px; }
  .rb-aux-tabs button { border:1px solid var(--line); background:#fff; padding:7px 11px; border-radius:8px; font-size:.78rem; }
  .rb-aux-tabs button.active { background:var(--brand-2); color:var(--brand); border-color:#a9d6c8; }
  .rb-aux-pane { display:none; }
  .rb-aux-pane.active { display:block; }
  .rb-aux-table input,.rb-aux-table select { min-width:100px; font-size:.78rem; padding:.25rem .4rem; }
  .rb-upload { border:1.5px dashed #a9c9bf; background:#f4fbf8; border-radius:12px; padding:18px; text-align:center; cursor:pointer; }
  .rb-upload:hover { border-color:var(--brand); }
  .rb-file-note { font-size:.76rem; color:var(--muted); margin-top:7px; }
  .rb-toast { position:fixed; right:24px; bottom:24px; z-index:11000; min-width:260px; max-width:380px; background:#172033; color:#fff; padding:12px 15px; border-radius:11px; box-shadow:0 12px 35px rgba(0,0,0,.22); display:none; font-size:.84rem; }
  .rb-toast.show { display:block; animation:rbIn .18s ease-out; }
  .rb-toast.error { background:#9f2925; }
  @keyframes rbIn { from{transform:translateY(8px);opacity:0} to{transform:none;opacity:1} }
  @media(max-width:900px){ .rb-kpis{grid-template-columns:repeat(2,1fr)} .rb-grid-2{grid-template-columns:1fr} .rb-period-grid,.rb-category-grid{grid-template-columns:repeat(2,1fr)} }
  @media(max-width:600px){ .rb-main{padding:14px} .rb-kpis{grid-template-columns:1fr 1fr;gap:9px} .rb-kpi{padding:14px}.rb-period-grid,.rb-category-grid{grid-template-columns:1fr}.rb-topbar{padding:19px}.rb-summary-grid{grid-template-columns:1fr} }
</style>

<div class="rb-app">
  <div class="rb-shell">
    <div class="rb-topbar">
      <h2><i class="bi bi-receipt-cutoff me-2"></i>发票报销管理</h2>
      <p>发票归档、双月周期、费用分类与财务模板导出</p>
    </div>
    <div class="rb-nav" id="rbNav">
      <button class="active" data-view="dashboard"><i class="bi bi-grid me-1"></i>仪表盘</button>
      <button data-view="invoices"><i class="bi bi-receipt me-1"></i>发票管理</button>
      <button data-view="periods"><i class="bi bi-calendar3 me-1"></i>周期管理</button>
      <button data-view="categories"><i class="bi bi-tags me-1"></i>类别管理</button>
      <button data-view="export"><i class="bi bi-file-earmark-excel me-1"></i>汇总导出</button>
    </div>

    <div class="rb-main">
      <section class="rb-view active" id="rbViewDashboard">
        <div class="rb-kpis">
          <div class="rb-kpi"><div class="label">发票总数</div><div class="value" id="rbStatCount">0</div></div>
          <div class="rb-kpi"><div class="label">累计价税合计</div><div class="value" id="rbStatAmount">¥0.00</div></div>
          <div class="rb-kpi"><div class="label">待报销</div><div class="value" id="rbStatPending">0</div></div>
          <div class="rb-kpi"><div class="label">报销周期</div><div class="value" id="rbStatPeriods">0</div></div>
        </div>
        <div class="rb-grid-2">
          <div class="rb-card">
            <div class="rb-card-head"><h3>最近发票</h3><button class="rb-btn rb-btn-light" onclick="RB.showView('invoices')">查看全部</button></div>
            <div class="rb-table-wrap"><table class="rb-table"><thead><tr><th>发票号码</th><th>开票单位</th><th>类别</th><th>价税合计</th><th>状态</th></tr></thead><tbody id="rbRecentBody"></tbody></table></div>
          </div>
          <div class="rb-card">
            <div class="rb-card-head"><h3>当前周期</h3></div>
            <div class="rb-card-body" id="rbActivePeriod"></div>
          </div>
        </div>
      </section>

      <section class="rb-view" id="rbViewInvoices">
        <div class="rb-toolbar">
          <input class="form-control" id="rbSearch" placeholder="搜索发票号码或开票单位">
          <select class="form-select" id="rbFilterPeriod"></select>
          <select class="form-select" id="rbFilterCategory"></select>
          <select class="form-select" id="rbFilterStatus">
            <option value="">全部状态</option><option value="pending">待报销</option><option value="approved">已通过</option><option value="rejected">已驳回</option>
          </select>
          <button class="rb-btn rb-btn-light" onclick="RB.loadInvoices(1)"><i class="bi bi-search"></i>筛选</button>
          <button class="rb-btn rb-btn-primary ms-auto" onclick="RB.openInvoice()"><i class="bi bi-plus-lg"></i>上传发票</button>
        </div>
        <div class="rb-card">
          <div class="rb-table-wrap"><table class="rb-table"><thead><tr><th>序号</th><th>发票号码</th><th>开票日期</th><th>开票单位</th><th>类别</th><th>价税合计</th><th>状态</th><th>操作</th></tr></thead><tbody id="rbInvoiceBody"></tbody></table></div>
          <div class="rb-card-body d-flex justify-content-between align-items-center py-2"><span class="rb-meta" id="rbPageInfo"></span><div class="d-flex gap-2"><button class="rb-btn rb-btn-light" id="rbPrev" onclick="RB.changePage(-1)">上一页</button><button class="rb-btn rb-btn-light" id="rbNext" onclick="RB.changePage(1)">下一页</button></div></div>
        </div>
      </section>

      <section class="rb-view" id="rbViewPeriods">
        <div class="rb-toolbar"><button class="rb-btn rb-btn-primary" onclick="RB.openPeriod()"><i class="bi bi-plus-lg"></i>新增周期</button><button class="rb-btn rb-btn-light" onclick="RB.createNextPeriod()"><i class="bi bi-arrow-right-circle"></i>生成下一周期</button></div>
        <div class="rb-period-grid" id="rbPeriodGrid"></div>
      </section>

      <section class="rb-view" id="rbViewCategories">
        <div class="rb-toolbar"><button class="rb-btn rb-btn-primary" onclick="RB.openCategory()"><i class="bi bi-plus-lg"></i>新增类别</button></div>
        <div class="rb-category-grid" id="rbCategoryGrid"></div>
      </section>

      <section class="rb-view" id="rbViewExport">
        <div class="rb-toolbar"><select class="form-select" id="rbExportPeriod" onchange="RB.loadSummary()"></select><button class="rb-btn rb-btn-light" onclick="RB.loadSummary()"><i class="bi bi-arrow-clockwise"></i>刷新汇总</button></div>
        <div class="rb-card">
          <div class="rb-card-head"><h3>周期汇总</h3><div class="d-flex gap-2 flex-wrap"><button class="rb-btn rb-btn-primary" onclick="RB.exportFile('cover')"><i class="bi bi-download"></i>导出封面及费用分类表</button><button class="rb-btn rb-btn-primary" onclick="RB.exportFile('details')"><i class="bi bi-download"></i>导出应酬/出差/派车明细</button></div></div>
          <div class="rb-card-body">
            <div class="rb-summary-grid" id="rbSummaryCards"></div>
            <div class="rb-table-wrap"><table class="rb-table"><thead><tr><th>类别</th><th>发票数量</th><th>金额合计</th><th>税额合计</th><th>价税合计</th></tr></thead><tbody id="rbSummaryBody"></tbody></table></div>
            <div class="rb-aux-tabs"><button class="active" data-aux="entertainment">应酬费明细</button><button data-aux="vehicle">派车单</button><button data-aux="travel">出差明细</button></div>
            <div id="rbAuxEntertainment" class="rb-aux-pane active"></div>
            <div id="rbAuxVehicle" class="rb-aux-pane"></div>
            <div id="rbAuxTravel" class="rb-aux-pane"></div>
            <button class="rb-btn rb-btn-light mt-3" onclick="RB.saveAux()"><i class="bi bi-save"></i>保存三张明细表</button>
          </div>
        </div>
      </section>
    </div>
  </div>
</div>

<div class="modal fade" id="rbInvoiceModal" tabindex="-1"><div class="modal-dialog modal-xl modal-dialog-scrollable"><div class="modal-content">
  <div class="modal-header"><h5 class="modal-title" id="rbInvoiceTitle">新增发票</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body">
    <input type="hidden" id="rbInvoiceId">
    <div class="rb-upload mb-3" onclick="document.getElementById('rbInvoiceFile').click()"><i class="bi bi-cloud-arrow-up fs-3 text-success"></i><div class="fw-semibold mt-1">点击选择或更换发票文件</div><div class="rb-file-note">JPG、PNG 或 PDF，单文件最大 20MB；上传后自动尝试 OCR</div><input type="file" id="rbInvoiceFile" accept=".jpg,.jpeg,.png,.pdf" hidden></div>
    <div class="rb-file-note mb-3" id="rbUploadedFile">尚未上传文件</div>
    <input type="hidden" id="rbFileUrl"><input type="hidden" id="rbFileName"><input type="hidden" id="rbFileSize">
    <div class="row g-3">
      <div class="col-md-3"><label class="form-label">报销周期 *</label><select class="form-select" id="rbInvPeriod"></select></div>
      <div class="col-md-3"><label class="form-label">费用类别</label><select class="form-select" id="rbInvCategory"></select></div>
      <div class="col-md-3"><label class="form-label">报销状态</label><select class="form-select" id="rbInvStatus"><option value="pending">待报销</option><option value="approved">已通过</option><option value="rejected">已驳回</option></select></div>
      <div class="col-md-3"><label class="form-label">开票日期</label><input type="date" class="form-control" id="rbInvDate"></div>
      <div class="col-md-4"><label class="form-label">发票号码</label><input class="form-control" id="rbInvNumber"></div>
      <div class="col-md-8"><label class="form-label">开票单位</label><input class="form-control" id="rbInvVendor"></div>
      <div class="col-md-4"><label class="form-label">金额（不含税）</label><input type="number" step="0.01" class="form-control" id="rbInvAmount"></div>
      <div class="col-md-4"><label class="form-label">税额</label><input type="number" step="0.01" class="form-control" id="rbInvTax"></div>
      <div class="col-md-4"><label class="form-label">价税合计</label><input type="number" step="0.01" class="form-control" id="rbInvTotal"></div>
      <div class="col-md-4"><label class="form-label">产品线</label><input class="form-control" list="rbProductLines" id="rbInvProduct" onchange="RB.syncProductCode()"><datalist id="rbProductLines"></datalist></div>
      <div class="col-md-2"><label class="form-label">产品线代码</label><input class="form-control" id="rbInvProductCode"></div>
      <div class="col-md-3"><label class="form-label">办事处</label><input class="form-control" id="rbInvOffice" value="深圳办"></div>
      <div class="col-md-3"><label class="form-label">客户等级</label><select class="form-select" id="rbInvLevel"><option value="">未分类</option><option>0-1</option><option>level 1</option><option>level 2</option><option>level 3</option></select></div>
      <div class="col-md-6"><label class="form-label">摘要</label><input class="form-control" id="rbInvDescription"></div>
      <div class="col-md-6"><label class="form-label">备注</label><input class="form-control" id="rbInvRemarks"></div>
    </div>
  </div>
  <div class="modal-footer"><button class="rb-btn rb-btn-light" data-bs-dismiss="modal">取消</button><button class="rb-btn rb-btn-primary" onclick="RB.saveInvoice()">保存发票</button></div>
</div></div></div>

<div class="modal fade" id="rbPeriodModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
  <div class="modal-header"><h5 class="modal-title">报销周期</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body"><input type="hidden" id="rbPeriodId"><div class="mb-3"><label class="form-label">周期名称</label><input class="form-control" id="rbPeriodName" placeholder="留空可自动生成"></div><div class="row g-2"><div class="col-6"><label class="form-label">开始年份</label><input type="number" class="form-control" id="rbStartYear"></div><div class="col-6"><label class="form-label">开始月份</label><input type="number" min="1" max="12" class="form-control" id="rbStartMonth"></div><div class="col-6"><label class="form-label">结束年份</label><input type="number" class="form-control" id="rbEndYear"></div><div class="col-6"><label class="form-label">结束月份</label><input type="number" min="1" max="12" class="form-control" id="rbEndMonth"></div></div></div>
  <div class="modal-footer"><button class="rb-btn rb-btn-light" data-bs-dismiss="modal">取消</button><button class="rb-btn rb-btn-primary" onclick="RB.savePeriod()">保存</button></div>
</div></div></div>

<div class="modal fade" id="rbCategoryModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
  <div class="modal-header"><h5 class="modal-title">费用类别</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body"><input type="hidden" id="rbCategoryId"><div class="mb-3"><label class="form-label">类别名称</label><input class="form-control" id="rbCategoryName"></div><div class="row g-2"><div class="col-6"><label class="form-label">导出映射</label><select class="form-select" id="rbCategoryKey"><option value="entertainment">招待费</option><option value="travel_transport">出差交通费</option><option value="travel_hotel">出差住宿费</option><option value="local_transport">市内交通费</option><option value="vehicle">车辆费用</option><option value="communication">通讯费</option><option value="office_supplies">办公费</option><option value="delivery">快递费</option><option value="welfare">福利</option><option value="other">其他</option></select></div><div class="col-6"><label class="form-label">标签颜色</label><input type="color" class="form-control form-control-color w-100" id="rbCategoryColor" value="#64748b"></div></div><div class="mt-3"><label class="form-label">描述</label><input class="form-control" id="rbCategoryDesc"></div></div>
  <div class="modal-footer"><button class="rb-btn rb-btn-light" data-bs-dismiss="modal">取消</button><button class="rb-btn rb-btn-primary" onclick="RB.saveCategory()">保存</button></div>
</div></div></div>
<div class="rb-toast" id="rbToast"></div>

<script>
const RB = {
  state:{periods:[],categories:[],recent:[],stats:{},invoices:[],page:1,pages:1,summary:null,aux:{entertainment:[],vehicle:[],travel:[]},reference:null},
  modal(name){ return bootstrap.Modal.getOrCreateInstance(document.getElementById(name)); },
  anonId(){ let id=localStorage.getItem('rb_anon_id'); if(!id){id=crypto.randomUUID?.()||Math.random().toString(36).slice(2);localStorage.setItem('rb_anon_id',id)} return id; },
  async api(url,options={}){ options.headers={...options.headers,'X-RB-Anon-Id':this.anonId()}; if(options.body && !(options.body instanceof FormData)){options.headers['Content-Type']='application/json';options.body=JSON.stringify(options.body)} const r=await fetch(url,options); const type=r.headers.get('content-type')||''; const data=type.includes('json')?await r.json():r; if(!r.ok){throw Object.assign(new Error(data.error||`请求失败 (${r.status})`),{status:r.status,data})} return data; },
  toast(message,error=false){ const el=document.getElementById('rbToast'); el.textContent=message; el.className='rb-toast show'+(error?' error':''); clearTimeout(this.toastTimer); this.toastTimer=setTimeout(()=>el.className='rb-toast',2800); },
  money(v){return '¥'+Number(v||0).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2})},
  esc(v){const d=document.createElement('div');d.textContent=v??'';return d.innerHTML},
  status(v){return `<span class="rb-badge rb-status-${v.status}">${this.esc(v.status_label||v.status)}</span>`},
  async init(){
    document.querySelectorAll('#rbNav button').forEach(b=>b.addEventListener('click',()=>this.showView(b.dataset.view)));
    document.querySelectorAll('.rb-aux-tabs button').forEach(b=>b.addEventListener('click',()=>this.showAux(b.dataset.aux)));
    document.getElementById('rbInvoiceFile').addEventListener('change',e=>this.uploadFile(e.target.files[0]));
    document.getElementById('rbInvAmount').addEventListener('input',()=>this.calcTotal());
    document.getElementById('rbInvTax').addEventListener('input',()=>this.calcTotal());
    document.getElementById('rbSearch').addEventListener('keydown',e=>{if(e.key==='Enter')this.loadInvoices(1)});
    try{ this.state.reference=await this.api('/tools/reimbursement/reference'); await this.reload(); }catch(e){this.toast(e.message,true)}
  },
  async reload(){
    const data=await this.api('/tools/reimbursement/api/bootstrap');
    Object.assign(this.state,data);
    this.renderDashboard();this.fillSelectors();this.renderPeriods();this.renderCategories();
  },
  showView(name){
    document.querySelectorAll('#rbNav button').forEach(b=>b.classList.toggle('active',b.dataset.view===name));
    document.querySelectorAll('.rb-view').forEach(v=>v.classList.remove('active'));
    document.getElementById('rbView'+name[0].toUpperCase()+name.slice(1)).classList.add('active');
    if(name==='invoices')this.loadInvoices(1); if(name==='export')this.loadSummary();
  },
  renderDashboard(){
    const s=this.state.stats||{}; document.getElementById('rbStatCount').textContent=s.invoice_count||0;document.getElementById('rbStatAmount').textContent=this.money(s.total_amount);document.getElementById('rbStatPending').textContent=s.pending_count||0;document.getElementById('rbStatPeriods').textContent=this.state.periods.length;
    document.getElementById('rbRecentBody').innerHTML=this.state.recent.length?this.state.recent.map(i=>`<tr><td>${this.esc(i.invoice_number||'—')}</td><td>${this.esc(i.vendor||'—')}</td><td>${i.category?`<span class="rb-badge" style="color:${i.category.color};background:${i.category.color}18"><span class="rb-color" style="background:${i.category.color}"></span>${this.esc(i.category.name)}</span>`:'—'}</td><td>${this.money(i.total_amount)}</td><td>${this.status(i)}</td></tr>`).join(''):'<tr><td colspan="5" class="rb-empty">还没有发票记录</td></tr>';
    const p=this.state.periods.find(x=>x.is_active)||this.state.periods[0];
    document.getElementById('rbActivePeriod').innerHTML=p?`<div class="rb-active-period"><div class="rb-meta mb-1">正在使用</div><div class="name">${this.esc(p.name)}</div><div class="rb-meta mt-2">${p.start_year}.${p.start_month} — ${p.end_year}.${p.end_month}</div><hr><div class="d-flex justify-content-between"><span>${p.invoice_count} 张发票</span><strong>${this.money(p.total_amount)}</strong></div></div>`:`<div class="rb-empty">尚未创建周期<br><button class="rb-btn rb-btn-primary mt-3" onclick="RB.showView('periods');RB.openPeriod()">创建第一个周期</button></div>`;
  },
  fillSelectors(){
    const periodOptions='<option value="">全部周期</option>'+this.state.periods.map(p=>`<option value="${p.id}">${this.esc(p.name)}</option>`).join('');
    const categoryOptions='<option value="">全部类别</option>'+this.state.categories.map(c=>`<option value="${c.id}">${this.esc(c.name)}</option>`).join('');
    document.getElementById('rbFilterPeriod').innerHTML=periodOptions;document.getElementById('rbFilterCategory').innerHTML=categoryOptions;
    document.getElementById('rbInvPeriod').innerHTML=this.state.periods.map(p=>`<option value="${p.id}">${this.esc(p.name)}</option>`).join('');
    document.getElementById('rbInvCategory').innerHTML='<option value="">未分类</option>'+this.state.categories.map(c=>`<option value="${c.id}">${this.esc(c.name)}</option>`).join('');
    const selected=document.getElementById('rbExportPeriod').value;document.getElementById('rbExportPeriod').innerHTML=this.state.periods.map(p=>`<option value="${p.id}" ${String(p.id)===selected?'selected':''}>${this.esc(p.name)}</option>`).join('');
    const pl=this.state.reference?.product_lines||[];document.getElementById('rbProductLines').innerHTML=pl.map(p=>`<option value="${this.esc(p.name)}"></option>`).join('');
  },
  async loadInvoices(page=1){
    const q=new URLSearchParams({page,per_page:20});[['q','rbSearch'],['period_id','rbFilterPeriod'],['category_id','rbFilterCategory'],['status','rbFilterStatus']].forEach(([k,id])=>{const v=document.getElementById(id).value;if(v)q.set(k,v)});
    try{const d=await this.api('/tools/reimbursement/api/invoices?'+q);this.state.invoices=d.invoices;this.state.page=d.pagination.page;this.state.pages=d.pagination.pages;this.renderInvoices(d.pagination)}catch(e){this.toast(e.message,true)}
  },
  renderInvoices(p){
    document.getElementById('rbInvoiceBody').innerHTML=this.state.invoices.length?this.state.invoices.map((i,n)=>`<tr><td>${(p.page-1)*p.per_page+n+1}</td><td>${this.esc(i.invoice_number||'—')}</td><td>${i.invoice_date||'—'}</td><td>${this.esc(i.vendor||'—')}</td><td>${i.category?`<span class="rb-badge" style="color:${i.category.color};background:${i.category.color}18">${this.esc(i.category.name)}</span>`:'—'}</td><td><strong>${this.money(i.total_amount)}</strong></td><td>${this.status(i)}</td><td><div class="d-flex gap-1">${i.file_url?`<a class="rb-btn rb-btn-light py-1" href="${this.esc(i.file_url)}" target="_blank">预览</a>`:''}<button class="rb-btn rb-btn-light py-1" onclick="RB.openInvoice(${i.id})">编辑</button><button class="rb-btn rb-btn-danger py-1" onclick="RB.deleteInvoice(${i.id})">删除</button></div></td></tr>`).join(''):'<tr><td colspan="8" class="rb-empty">没有符合条件的发票</td></tr>';
    document.getElementById('rbPageInfo').textContent=`第 ${p.page}/${p.pages} 页，共 ${p.total} 条`;document.getElementById('rbPrev').disabled=p.page<=1;document.getElementById('rbNext').disabled=p.page>=p.pages;
  },
  changePage(delta){const p=this.state.page+delta;if(p>=1&&p<=this.state.pages)this.loadInvoices(p)},
  openInvoice(id=null){
    const i=id?this.state.invoices.find(x=>x.id===id):null;document.getElementById('rbInvoiceTitle').textContent=i?'编辑发票':'新增发票';
    const map={rbInvoiceId:i?.id||'',rbFileUrl:i?.file_url||'',rbFileName:i?.file_name||'',rbFileSize:i?.file_size||'',rbInvPeriod:i?.period_id||this.state.periods.find(p=>p.is_active)?.id||this.state.periods[0]?.id||'',rbInvCategory:i?.category_id||'',rbInvStatus:i?.status||'pending',rbInvDate:i?.invoice_date||'',rbInvNumber:i?.invoice_number||'',rbInvVendor:i?.vendor||'',rbInvAmount:i?.amount||'',rbInvTax:i?.tax_amount||'',rbInvTotal:i?.total_amount||'',rbInvProduct:i?.product_line||'',rbInvProductCode:i?.product_line_code||'',rbInvOffice:i?.office||this.state.periods.find(p=>p.is_active)?.office||'深圳办',rbInvLevel:i?.customer_level||'',rbInvDescription:i?.description||'',rbInvRemarks:i?.remarks||''};
    Object.entries(map).forEach(([id,v])=>document.getElementById(id).value=v);document.getElementById('rbUploadedFile').textContent=i?.file_name?`已关联：${i.file_name}`:'尚未上传文件';document.getElementById('rbInvoiceFile').value='';this.modal('rbInvoiceModal').show();
  },
  calcTotal(){const a=parseFloat(document.getElementById('rbInvAmount').value)||0,t=parseFloat(document.getElementById('rbInvTax').value)||0;document.getElementById('rbInvTotal').value=(a+t).toFixed(2)},
  syncProductCode(){const name=document.getElementById('rbInvProduct').value;const p=(this.state.reference?.product_lines||[]).find(x=>x.name===name);if(p)document.getElementById('rbInvProductCode').value=p.code},
  async uploadFile(file){
    if(!file)return;if(file.size>20*1024*1024){this.toast('单文件不能超过 20MB',true);return}
    const fd=new FormData();fd.append('file',file);document.getElementById('rbUploadedFile').textContent='正在上传并识别…';
    try{const uploaded=await this.api('/tools/reimbursement/upload',{method:'POST',body:fd});document.getElementById('rbFileUrl').value=uploaded.full_url||uploaded.preview_url;document.getElementById('rbFileName').value=uploaded.original_name;document.getElementById('rbFileSize').value=uploaded.size||file.size;document.getElementById('rbUploadedFile').textContent=`已上传：${uploaded.original_name}`;
      const image_base64=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(file)});const ocr=await this.api('/tools/reimbursement/ocr',{method:'POST',body:{file_id:uploaded.file_id,image_base64}}).catch(()=>null);if(ocr?.success){const d=ocr.data||{};document.getElementById('rbInvNumber').value=d.invoice_number||'';document.getElementById('rbInvDate').value=d.invoice_date||'';document.getElementById('rbInvVendor').value=d.seller_name||'';document.getElementById('rbInvAmount').value=d.amount_excluding_tax||'';document.getElementById('rbInvTax').value=d.tax_amount||'';document.getElementById('rbInvTotal').value=d.total_amount||'';document.getElementById('rbInvDescription').value=d.description||'';this.toast('上传完成，已回填识别结果')}else this.toast('上传完成，请核对并补充发票信息');
    }catch(e){document.getElementById('rbUploadedFile').textContent='上传失败';this.toast(e.message,true)}
  },
  invoicePayload(){const val=id=>document.getElementById(id).value;return {period_id:+val('rbInvPeriod'),category_id:val('rbInvCategory')?+val('rbInvCategory'):null,status:val('rbInvStatus'),invoice_date:val('rbInvDate'),invoice_number:val('rbInvNumber'),vendor:val('rbInvVendor'),amount:val('rbInvAmount'),tax_amount:val('rbInvTax'),total_amount:val('rbInvTotal'),product_line:val('rbInvProduct'),product_line_code:val('rbInvProductCode'),office:val('rbInvOffice'),customer_level:val('rbInvLevel'),description:val('rbInvDescription'),remarks:val('rbInvRemarks'),file_url:val('rbFileUrl'),file_name:val('rbFileName'),file_size:val('rbFileSize')}},
  async saveInvoice(){const id=document.getElementById('rbInvoiceId').value;try{await this.api('/tools/reimbursement/api/invoices'+(id?'/'+id:''),{method:id?'PUT':'POST',body:this.invoicePayload()});this.modal('rbInvoiceModal').hide();this.toast(id?'发票已更新':'发票已保存');await this.reload();this.loadInvoices(this.state.page)}catch(e){this.toast(e.message,true)}},
  async deleteInvoice(id){if(!confirm('确定删除这张发票记录及其本地附件吗？'))return;try{await this.api('/tools/reimbursement/api/invoices/'+id,{method:'DELETE'});this.toast('发票已删除');await this.reload();this.loadInvoices(this.state.page)}catch(e){this.toast(e.message,true)}},
  renderPeriods(){document.getElementById('rbPeriodGrid').innerHTML=this.state.periods.length?this.state.periods.map(p=>`<div class="rb-period-card ${p.is_active?'active':''}"><div class="d-flex justify-content-between"><div class="title">${this.esc(p.name)}</div>${p.is_active?'<span class="rb-badge rb-status-approved">当前周期</span>':''}</div><div class="rb-meta">${p.start_year}年${p.start_month}月 — ${p.end_year}年${p.end_month}月</div><div class="d-flex justify-content-between mt-3"><span>${p.invoice_count} 张</span><strong>${this.money(p.total_amount)}</strong></div><div class="rb-card-actions">${!p.is_active?`<button class="rb-btn rb-btn-light" onclick="RB.activatePeriod(${p.id})">设为当前</button>`:''}<button class="rb-btn rb-btn-light" onclick="RB.openPeriod(${p.id})">编辑</button><button class="rb-btn rb-btn-danger" onclick="RB.deletePeriod(${p.id})">删除</button></div></div>`).join(''):'<div class="rb-empty">尚未创建报销周期</div>'},
  openPeriod(id=null){const p=id?this.state.periods.find(x=>x.id===id):null;const now=new Date(),sm=now.getMonth()+1,em=sm%12+1,ey=now.getFullYear()+(sm===12?1:0);document.getElementById('rbPeriodId').value=p?.id||'';document.getElementById('rbPeriodName').value=p?.name||'';document.getElementById('rbStartYear').value=p?.start_year||now.getFullYear();document.getElementById('rbStartMonth').value=p?.start_month||sm;document.getElementById('rbEndYear').value=p?.end_year||ey;document.getElementById('rbEndMonth').value=p?.end_month||em;this.modal('rbPeriodModal').show()},
  async savePeriod(){const id=document.getElementById('rbPeriodId').value,v=x=>document.getElementById(x).value,p={name:v('rbPeriodName'),start_year:+v('rbStartYear'),start_month:+v('rbStartMonth'),end_year:+v('rbEndYear'),end_month:+v('rbEndMonth')};try{await this.api('/tools/reimbursement/api/periods'+(id?'/'+id:''),{method:id?'PUT':'POST',body:p});this.modal('rbPeriodModal').hide();this.toast('周期已保存');await this.reload()}catch(e){this.toast(e.message,true)}},
  async createNextPeriod(){try{await this.api('/tools/reimbursement/api/periods/next',{method:'POST',body:{}});this.toast('下一周期已生成');await this.reload()}catch(e){this.toast(e.message,true)}},
  async activatePeriod(id){const p=this.state.periods.find(x=>x.id===id);try{await this.api('/tools/reimbursement/api/periods/'+id,{method:'PUT',body:{start_year:p.start_year,start_month:p.start_month,end_year:p.end_year,end_month:p.end_month,name:p.name,is_active:true}});this.toast('当前周期已切换');await this.reload()}catch(e){this.toast(e.message,true)}},
  async deletePeriod(id){if(!confirm('确定删除这个周期吗？若含发票将再次确认。'))return;try{await this.api('/tools/reimbursement/api/periods/'+id,{method:'DELETE'});this.toast('周期已删除');await this.reload()}catch(e){if(e.data?.needs_confirmation&&confirm(`该周期有 ${e.data.invoice_count} 张发票，仍要全部删除吗？`)){await this.api('/tools/reimbursement/api/periods/'+id+'?force=1',{method:'DELETE'});this.toast('周期及发票已删除');await this.reload()}else if(!e.data?.needs_confirmation)this.toast(e.message,true)}},
  renderCategories(){document.getElementById('rbCategoryGrid').innerHTML=this.state.categories.map(c=>`<div class="rb-category-card"><div class="d-flex align-items-center gap-2"><span class="rb-color" style="background:${c.color};width:12px;height:12px"></span><div class="title mb-0">${this.esc(c.name)}</div></div><div class="rb-meta mt-2">${this.esc(c.description||'暂无描述')}</div><div class="rb-meta mt-2">导出映射：${this.esc(c.export_key)}</div><div class="rb-card-actions"><button class="rb-btn rb-btn-light" onclick="RB.openCategory(${c.id})">编辑</button><button class="rb-btn rb-btn-danger" onclick="RB.deleteCategory(${c.id})">删除</button></div></div>`).join('')},
  openCategory(id=null){const c=id?this.state.categories.find(x=>x.id===id):null;document.getElementById('rbCategoryId').value=c?.id||'';document.getElementById('rbCategoryName').value=c?.name||'';document.getElementById('rbCategoryKey').value=c?.export_key||'other';document.getElementById('rbCategoryColor').value=c?.color||'#64748b';document.getElementById('rbCategoryDesc').value=c?.description||'';this.modal('rbCategoryModal').show()},
  async saveCategory(){const id=document.getElementById('rbCategoryId').value,v=x=>document.getElementById(x).value;try{await this.api('/tools/reimbursement/api/categories'+(id?'/'+id:''),{method:id?'PUT':'POST',body:{name:v('rbCategoryName'),export_key:v('rbCategoryKey'),color:v('rbCategoryColor'),description:v('rbCategoryDesc')}});this.modal('rbCategoryModal').hide();this.toast('类别已保存');await this.reload()}catch(e){this.toast(e.message,true)}},
  async deleteCategory(id){const targets=this.state.categories.filter(x=>x.id!==id);if(!confirm('确定删除这个类别吗？有关联发票时需迁移。'))return;try{await this.api('/tools/reimbursement/api/categories/'+id,{method:'DELETE'});this.toast('类别已删除');await this.reload()}catch(e){if(e.data?.needs_migration){const name=prompt(`该类别有 ${e.data.invoice_count} 张发票。请输入迁移目标类别名称：`,targets[0]?.name||'');const target=targets.find(x=>x.name===name);if(!target){this.toast('未找到迁移目标类别',true);return}await this.api(`/tools/reimbursement/api/categories/${id}?migrate_to=${target.id}`,{method:'DELETE'});this.toast('发票已迁移，类别已删除');await this.reload()}else this.toast(e.message,true)}},
  async loadSummary(){const id=+document.getElementById('rbExportPeriod').value;if(!id){document.getElementById('rbSummaryBody').innerHTML='<tr><td colspan="5" class="rb-empty">请先创建并选择报销周期</td></tr>';return}try{const d=await this.api('/tools/reimbursement/api/summary/'+id);this.state.summary=d.summary;this.state.aux=d.aux;this.renderSummary()}catch(e){this.toast(e.message,true)}},
  renderSummary(){const s=this.state.summary;document.getElementById('rbSummaryCards').innerHTML=`<div class="rb-summary-box"><small>发票数量</small><strong>${s.invoice_count} 张</strong></div><div class="rb-summary-box"><small>税额合计</small><strong>${this.money(s.tax_amount)}</strong></div><div class="rb-summary-box"><small>价税合计</small><strong>${this.money(s.total_amount)}</strong></div>`;document.getElementById('rbSummaryBody').innerHTML=s.by_category.map(c=>`<tr><td><span class="rb-color me-2" style="background:${c.color}"></span>${this.esc(c.name)}</td><td>${c.invoice_count}</td><td>${this.money(c.amount)}</td><td>${this.money(c.tax_amount)}</td><td><strong>${this.money(c.total_amount)}</strong></td></tr>`).join('');this.renderAux()},
  showAux(kind){document.querySelectorAll('.rb-aux-tabs button').forEach(b=>b.classList.toggle('active',b.dataset.aux===kind));document.querySelectorAll('.rb-aux-pane').forEach(p=>p.classList.remove('active'));document.getElementById('rbAux'+kind[0].toUpperCase()+kind.slice(1)).classList.add('active')},
  renderAux(){const schemas={
    entertainment:[['date','日期','date'],['category','费用类别','text'],['place','用餐地点/名称','text'],['customer','客户名称','text'],['participants','参与人','text'],['amount','金额','number'],['purpose','事由/产品线','text']],
    vehicle:[['date','日期','date'],['from_location','出发地','text'],['to_location','目的地','text'],['contact','联系人','text'],['km_start','起','number'],['km_end','止','number'],['km_total','公里','number'],['toll_fee','过桥费','number'],['parking_fee','停车费','number'],['remarks','备注','text']],
    travel:[['date','日期','date'],['location','出差地','text'],['customer','客户名称','text'],['expense_type','费用类型','text'],['amount','金额','number'],['purpose','事由/产品线','text']]
  };Object.entries(schemas).forEach(([kind,fields])=>{const rows=this.state.aux[kind]||[];document.getElementById('rbAux'+kind[0].toUpperCase()+kind.slice(1)).innerHTML=`<div class="rb-table-wrap"><table class="rb-table rb-aux-table"><thead><tr>${fields.map(f=>`<th>${f[1]}</th>`).join('')}<th></th></tr></thead><tbody>${rows.map((r,ri)=>`<tr>${fields.map(f=>`<td><input class="form-control" type="${f[2]}" step="${f[2]==='number'?'0.01':''}" value="${this.esc(r[f[0]]??'')}" onchange="RB.setAux('${kind}',${ri},'${f[0]}',this.value)"></td>`).join('')}<td><button class="rb-btn rb-btn-danger py-1" onclick="RB.removeAux('${kind}',${ri})">删除</button></td></tr>`).join('')}</tbody></table></div><button class="rb-btn rb-btn-light mt-2" onclick="RB.addAux('${kind}')"><i class="bi bi-plus"></i>添加一行</button>`})},
  setAux(kind,row,key,value){this.state.aux[kind][row][key]=value},addAux(kind){this.state.aux[kind].push({});this.renderAux()},removeAux(kind,row){this.state.aux[kind].splice(row,1);this.renderAux()},
  async saveAux(){const id=+document.getElementById('rbExportPeriod').value;try{await this.api('/tools/reimbursement/api/aux/'+id,{method:'PUT',body:this.state.aux});this.toast('三张明细表已保存')}catch(e){this.toast(e.message,true)}},
  exportFile(kind){const id=+document.getElementById('rbExportPeriod').value;if(!id){this.toast('请先选择周期',true);return}window.location.href=`/tools/reimbursement/api/export/${kind}/${id}`;}
};
document.addEventListener('DOMContentLoaded',()=>RB.init());
</script>
