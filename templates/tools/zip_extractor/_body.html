{% raw %}
<style>
  :root {
    --ze-primary: #6f42c1;
  }

  .ze-upload-zone {
    border: 2px dashed #adb5bd;
    border-radius: 0.5rem;
    padding: 2.5rem;
    text-align: center;
    cursor: pointer;
    transition: all 0.25s;
    background: #f8f9fa;
  }
  .ze-upload-zone:hover, .ze-upload-zone.dragover {
    border-color: var(--ze-primary);
    background: #f3f0ff;
  }
  .ze-upload-zone i { font-size: 2.5rem; color: var(--ze-primary); }

  /* 上传文件暂存列表 */
  .ze-queue { margin-top: 1rem; }
  .ze-queue-item {
    display: flex; align-items: center; gap: 0.5rem;
    padding: 0.4rem 0.6rem; background: #fff;
    border: 1px solid #dee2e6; border-radius: 0.35rem;
    margin-bottom: 0.35rem; font-size: 0.82rem;
  }
  .ze-queue-item .ze-q-icon { color: #6f42c1; font-size: 1.1rem; flex-shrink: 0; }
  .ze-queue-item .ze-q-name { flex: 1; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ze-queue-item .ze-q-size { color: #6c757d; font-size: 0.75rem; flex-shrink: 0; white-space: nowrap; }
  .ze-queue-item .ze-q-del { flex-shrink: 0; cursor: pointer; color: #dc3545; font-size: 1rem; padding: 0 4px; }

  .ze-actions { display: flex; gap: 0.5rem; align-items: center; margin-top: 0.75rem; flex-wrap: wrap; }

  /* PDF 结果列表 */
  .ze-file-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 0.6rem;
    max-height: 60vh; overflow-y: auto; margin-top: 1rem;
  }
  .ze-file-item {
    display: flex; align-items: center; gap: 0.6rem;
    padding: 0.5rem 0.7rem; background: #fff;
    border: 1px solid #dee2e6; border-radius: 0.4rem;
    font-size: 0.82rem; transition: all 0.15s;
  }
  .ze-file-item:hover { background: #f8f9fa; border-color: #adb5bd; }
  .ze-file-item .ze-icon { font-size: 1.3rem; color: #dc3545; flex-shrink: 0; }
  .ze-file-item .ze-info { flex: 1; overflow: hidden; }
  .ze-file-item .ze-name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ze-file-item .ze-meta { font-size: 0.72rem; color: #6c757d; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ze-file-item .ze-dl { flex-shrink: 0; }
  .ze-file-item.deselected { opacity: 0.45; background: #f8f9fa; }
  .ze-file-item .ze-cb { flex-shrink: 0; width: 16px; height: 16px; cursor: pointer; accent-color: var(--ze-primary); }

  .ze-summary {
    display: flex; align-items: center; gap: 1rem;
    padding: 0.75rem 1rem; background: #f0f2f5;
    border-radius: 0.4rem; margin: 1rem 0; font-size: 0.85rem;
  }
  .ze-summary .badge { font-size: 0.8rem; }

  .ze-empty {
    text-align: center; padding: 3rem 1rem; color: #adb5bd;
  }
  .ze-empty i { font-size: 3rem; display: block; margin-bottom: 0.5rem; }

  .ze-loading { text-align: center; padding: 2rem; }
</style>

<div class="mb-3">
  <h5><i class="bi bi-file-zip"></i> 批量压缩包 PDF 提取</h5>
  <p class="text-muted small mb-0">上传压缩包，递归解压并提取出所有 PDF 发票文件（支持多层嵌套 zip）。</p>
</div>

<!-- 上传区 -->
<div class="ze-upload-zone" id="zeUploadZone">
  <i class="bi bi-cloud-upload"></i>
  <p class="mt-2 mb-1 fw-bold">拖拽或点击选择 zip 文件</p>
  <p class="text-muted small mb-0">支持同时选择多个，可继续追加</p>
  <input type="file" id="zeFileInput" multiple accept=".zip" hidden>
</div>

<!-- 上传暂存列表 -->
<div class="ze-queue hidden" id="zeQueue"></div>

<!-- 操作按钮行 -->
<div class="ze-actions hidden" id="zeActions">
  <button class="btn btn-primary" id="zeStartBtn" onclick="startExtract()">
    <i class="bi bi-search"></i> 开始递归解压并提取 PDF
  </button>
  <button class="btn btn-outline-secondary btn-sm" onclick="clearQueue()">
    <i class="bi bi-trash"></i> 清空列表
  </button>
  <span class="text-muted small" id="zeQueueCount"></span>
</div>

<!-- 加载中 -->
<div class="ze-loading hidden" id="zeLoading">
  <div class="spinner-border text-primary" role="status"></div>
  <p class="mt-2 text-muted small">正在递归解压并提取 PDF …</p>
</div>

<!-- 结果展示 -->
<div id="zeResult" class="hidden"></div>

<div class="ze-empty" id="zeEmpty">
  <i class="bi bi-inbox"></i>
  <p>还没上传任何压缩包</p>
</div>

<script>
const STATE = { queue: [], files: [] };

document.addEventListener('DOMContentLoaded', () => {
  const zone = document.getElementById('zeUploadZone');
  const input = document.getElementById('zeFileInput');
  zone.addEventListener('click', () => input.click());
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('dragover'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
  zone.addEventListener('drop', e => {
    e.preventDefault(); zone.classList.remove('dragover');
    addToQueue(e.dataTransfer.files);
  });
  input.addEventListener('change', () => { addToQueue(input.files); input.value = ''; });
});

// ===== 步骤 1：上传暂存 =====
function addToQueue(files) {
  const added = [];
  for (const f of files) {
    if (!f || !f.name || f.size === 0) continue;
    if (!f.name.toLowerCase().endsWith('.zip')) continue;
    if (f.size > 50 * 1024 * 1024) { alert(`文件 ${f.name} 超过 50MB 上限`); continue; }
    STATE.queue.push({ file: f, name: f.name, size: f.size, sizeStr: formatSize(f.size) });
    added.push(f.name);
  }
  if (added.length > 0) renderQueue();
}

function removeFromQueue(idx) {
  STATE.queue.splice(idx, 1);
  renderQueue();
}

function clearQueue() {
  STATE.queue = [];
  renderQueue();
}

function renderQueue() {
  const el = document.getElementById('zeQueue');
  const actions = document.getElementById('zeActions');
  const countEl = document.getElementById('zeQueueCount');

  if (STATE.queue.length === 0) {
    el.classList.add('hidden');
    actions.classList.add('hidden');
    document.getElementById('zeEmpty').classList.remove('hidden');
    return;
  }

  el.classList.remove('hidden');
  actions.classList.remove('hidden');
  document.getElementById('zeEmpty').classList.add('hidden');

  const totalSize = STATE.queue.reduce((s, q) => s + q.size, 0);
  countEl.textContent = `${STATE.queue.length} 个文件，共 ${formatSize(totalSize)}`;

  el.innerHTML = STATE.queue.map((q, i) => `
    <div class="ze-queue-item">
      <span class="ze-q-icon"><i class="bi bi-file-zip"></i></span>
      <span class="ze-q-name" title="${q.name}">${q.name}</span>
      <span class="ze-q-size">${q.sizeStr}</span>
      <span class="ze-q-del" onclick="removeFromQueue(${i})" title="移除">&times;</span>
    </div>
  `).join('');
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/(1024*1024)).toFixed(1) + ' MB';
}

// ===== 步骤 2：发送后端解压 =====
async function startExtract() {
  if (STATE.queue.length === 0) return;

  document.getElementById('zeLoading').classList.remove('hidden');
  document.getElementById('zeResult').classList.add('hidden');
  document.getElementById('zeStartBtn').disabled = true;

  const fd = new FormData();
  STATE.queue.forEach(q => fd.append('files', q.file, q.name));

  try {
    const resp = await fetch('/tools/zip-extractor/analyze', { method: 'POST', body: fd });
    const text = await resp.text();
    let data;
    try {
      data = JSON.parse(text);
    } catch (e) {
      console.error('Non-JSON response:', text.substring(0, 500));
      throw new Error(`服务器返回非 JSON（HTTP ${resp.status}）：` + (text.substring(0, 150) || resp.statusText));
    }
    if (data.success) {
      STATE.files = data.files.map(f => ({ ...f, _selected: true }));
      renderResult(data);
    } else {
      alert('处理失败: ' + (data.error || '未知错误'));
    }
  } catch(e) {
    alert('网络异常: ' + e.message);
  } finally {
    document.getElementById('zeLoading').classList.add('hidden');
    document.getElementById('zeStartBtn').disabled = false;
  }
}

// ===== 步骤 3：结果展示 =====
function renderResult(data) {
  const el = document.getElementById('zeResult');
  const selectedCount = STATE.files.filter(f => f._selected !== false).length;

  let html = `
    <div class="ze-summary">
      <span class="badge bg-success">${selectedCount}/${data.total} 个 PDF 文件</span>
      <span class="text-muted">共 ${(data.files.reduce((s, f) => s + (f.size || 0), 0) / 1024 / 1024).toFixed(1)} MB</span>
      <label class="ms-auto me-2 small" style="cursor:pointer;user-select:none;">
        <input type="checkbox" id="zeSelectAll" onchange="toggleSelectAll(this)" checked style="accent-color:var(--ze-primary);"> 全选
      </label>
      <button class="btn btn-outline-danger btn-sm me-1" onclick="deleteSelected()" title="删除选中">
        <i class="bi bi-trash"></i>
      </button>
      <button class="btn btn-outline-primary btn-sm" onclick="downloadSelected()">
        <i class="bi bi-download"></i> 导出选中 (ZIP)
      </button>
    </div>
    <div class="ze-file-list">
  `;

  data.files.forEach((f, i) => {
    const chain = (f.path_chain || []).slice(-2).join(' / ');
    const checked = f._selected !== false ? 'checked' : '';
    html += `
      <div class="ze-file-item${checked ? '' : ' deselected'}" id="zeFile${i}">
        <input type="checkbox" class="ze-cb" ${checked} onchange="onFileToggle(${i},this.checked)" data-idx="${i}">
        <span class="ze-icon"><i class="bi bi-file-pdf"></i></span>
        <div class="ze-info">
          <div class="ze-name" title="${f.filename}">${f.filename}</div>
          <div class="ze-meta" title="${chain}">${chain} · ${f.size_kb} KB</div>
        </div>
        <button class="btn btn-outline-danger btn-sm ze-dl" onclick="downloadSingle(${i})" title="单独下载">
          <i class="bi bi-download"></i>
        </button>
      </div>
    `;
  });

  html += '</div>';
  el.innerHTML = html;
  el.classList.remove('hidden');
}

function downloadSingle(idx) {
  const f = STATE.files[idx];
  if (!f || !f.data_b64) return;
  const byteStr = atob(f.data_b64);
  const bytes = new Uint8Array(byteStr.length);
  for (let i = 0; i < byteStr.length; i++) bytes[i] = byteStr.charCodeAt(i);
  const blob = new Blob([bytes], { type: 'application/pdf' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = f.filename; a.click();
  URL.revokeObjectURL(url);
}

// ===== 选择与导出 =====
function toggleSelectAll(cb) {
  STATE.files.forEach(f => { f._selected = cb.checked; });
  document.querySelectorAll('.ze-cb').forEach(c => c.checked = cb.checked);
  document.querySelectorAll('.ze-file-item').forEach(el => el.classList.toggle('deselected', !cb.checked));
  refreshSummary();
}

function onFileToggle(idx, checked) {
  STATE.files[idx]._selected = checked;
  document.getElementById('zeFile'+idx)?.classList.toggle('deselected', !checked);
  const allCbs = document.querySelectorAll('.ze-cb');
  const allSel = document.getElementById('zeSelectAll');
  if (allSel) allSel.checked = Array.from(allCbs).every(c => c.checked);
  refreshSummary();
}

function deleteSelected() {
  const before = STATE.files.length;
  STATE.files = STATE.files.filter(f => f._selected !== false);
  const removed = before - STATE.files.length;
  if (removed === 0) { alert('请先勾选要删除的文件'); return; }
  if (!confirm(`确定删除 ${removed} 个文件吗？`)) return;
  renderResult({ total: STATE.files.length, files: STATE.files });
}

function downloadSelected() {
  if (typeof JSZip === 'undefined') {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
    s.onload = () => downloadSelected();
    document.head.appendChild(s);
    return;
  }
  const selected = STATE.files.filter(f => f._selected !== false);
  if (selected.length === 0) { alert('没有选中的文件'); return; }
  if (selected.length === 1) { downloadSingle(STATE.files.indexOf(selected[0])); return; }
  const zip = new JSZip();
  const names = {};
  selected.forEach(f => {
    if (!f.data_b64) return;
    let name = f.filename;
    names[name] = (names[name] || 0) + 1;
    if (names[name] > 1) {
      const dot = name.lastIndexOf('.');
      name = dot > 0 ? name.slice(0, dot) + `_${names[name]-1}` + name.slice(dot) : name + `_${names[name]-1}`;
    }
    zip.file(name, f.data_b64, { base64: true });
  });
  zip.generateAsync({ type: 'blob' }).then(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = '提取的发票文件.zip'; a.click();
    URL.revokeObjectURL(url);
  }).catch(err => alert('打包失败: ' + err.message));
}

function refreshSummary() {
  const total = STATE.files.length;
  const selected = STATE.files.filter(f => f._selected !== false).length;
  const badge = document.querySelector('.ze-summary .badge');
  if (badge) badge.textContent = `${selected}/${total} 个 PDF 文件`;
}
</script>
{% endraw %}
