<style>
:root {
  --ip-primary: #198754;
}

.ip-upload-zone {
  border: 2px dashed #adb5bd;
  border-radius: 0.5rem;
  padding: 2.2rem;
  text-align: center;
  cursor: pointer;
  transition: all 0.25s;
  background: #f8f9fa;
}
.ip-upload-zone:hover, .ip-upload-zone.dragover {
  border-color: var(--ip-primary);
  background: #eaf6ef;
}
.ip-upload-zone i { font-size: 2.3rem; color: var(--ip-primary); }

/* 队列 */
.ip-queue { margin-top: 0.75rem; }
.ip-queue-item {
  display: flex; align-items: center; gap: 0.5rem;
  padding: 0.35rem 0.55rem; background: #fff;
  border: 1px solid #dee2e6; border-radius: 0.35rem;
  margin-bottom: 0.3rem; font-size: 0.8rem;
}
.ip-queue-item .ip-q-icon { color: var(--ip-primary); font-size: 1rem; flex-shrink: 0; }
.ip-queue-item .ip-q-main { flex: 1; min-width: 0; }
.ip-queue-item .ip-q-name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ip-queue-item .ip-q-error { color: #b02a37; font-size: 0.7rem; margin-top: 0.1rem; white-space: normal; }
.ip-queue-item .ip-q-size { color: #6c757d; font-size: 0.72rem; flex-shrink: 0; }
.ip-queue-item .ip-q-del {
  flex-shrink: 0; color: #dc3545; font-size: 0.95rem; padding: 0.1rem 0.35rem;
  border: 0; background: transparent; border-radius: 0.25rem; line-height: 1;
}
.ip-queue-item .ip-q-del:hover, .ip-queue-item .ip-q-del:focus-visible { background: #f8d7da; }

.ip-actions { display: flex; gap: 0.5rem; align-items: center; margin-top: 0.75rem; flex-wrap: wrap; }

/* 结果面板 */
.ip-summary {
  display: flex; align-items: center; gap: 0.75rem;
  padding: 0.65rem 0.9rem; background: #f0f2f5;
  border-radius: 0.4rem; margin: 1rem 0; font-size: 0.82rem;
  flex-wrap: wrap;
}
.ip-summary .badge { font-size: 0.75rem; }

.ip-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 0.5rem;
  max-height: 60vh; overflow-y: auto; margin-top: 0.5rem;
}
.ip-card {
  display: flex; align-items: flex-start; gap: 0.55rem;
  padding: 0.5rem 0.65rem; background: #fff;
  border: 1px solid #dee2e6; border-radius: 0.4rem;
  font-size: 0.8rem; transition: all 0.15s;
  position: relative;
}
.ip-card:hover { background: #f8f9fa; border-color: #adb5bd; }
.ip-card.deselected { opacity: 0.4; background: #f8f9fa; }

/* 缩略图 */
.ip-thumb {
  width: 56px; height: 76px; flex-shrink: 0;
  border: 1px solid #dee2e6; border-radius: 3px;
  overflow: hidden; display: flex; align-items: center; justify-content: center;
  background: #f8f9fa; color: #adb5bd;
}
.ip-thumb img { width: 100%; height: 100%; object-fit: contain; }
.ip-thumb .ip-thumb-icon { font-size: 2rem; }
.ip-thumb .ip-thumb-icon.pdf { color: #dc3545; }
.ip-thumb .ip-thumb-icon.img { color: #fd7e14; }

.ip-card .ip-cb { flex-shrink: 0; width: 15px; height: 15px; cursor: pointer; accent-color: var(--ip-primary); margin-top: 2px; }
.ip-card .ip-info { flex: 1; overflow: hidden; min-width: 0; }
.ip-card .ip-name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ip-card .ip-meta { font-size: 0.7rem; color: #6c757d; margin-top: 1px; }
.ip-card .ip-btns { display: flex; gap: 3px; flex-shrink: 0; }
.ip-card .ip-btns .btn { font-size: 0.7rem; padding: 2px 7px; line-height: 1.4; }

.ip-empty {
  text-align: center; padding: 3rem 1rem; color: #adb5bd;
}
.ip-empty i { font-size: 3rem; display: block; margin-bottom: 0.5rem; }

/* 进度 */
.ip-progress-wrap { width: 100%; margin-top: 0.5rem; }
.ip-progress { height: 5px; background: #e9ecef; border-radius: 3px; overflow: hidden; }
.ip-progress-bar { height: 100%; background: var(--ip-primary); width: 0%; transition: width 0.3s ease; }
.ip-progress-text { font-size: 0.75rem; color: #6c757d; margin-top: 0.2rem; }

/* 提示条 */
.ip-toast {
  position: fixed; top: 1rem; right: 1rem; z-index: 9999;
  padding: 0.6rem 1rem; border-radius: 0.35rem; font-size: 0.82rem;
  max-width: 360px; box-shadow: 0 4px 12px rgba(0,0,0,.15);
  display: none;
}
.ip-toast.show { display: block; }
.ip-toast.info { background: #cff4fc; color: #055160; border: 1px solid #b6effb; }
.ip-toast.warn { background: #fff3cd; color: #664d03; border: 1px solid #ffc107; }
</style>

<div class="mb-3">
  <h5><i class="bi bi-receipt"></i> 发票提取与批量打印</h5>
  <p class="text-muted small mb-0">
    ZIP 会在服务器内存中安全提取 PDF（不落盘、不保存）；PDF 和图片直接在浏览器本地预览、打印或导出。
  </p>
</div>

<!-- 上传区 -->
<div class="ip-upload-zone" id="ipUploadZone">
  <i class="bi bi-cloud-upload"></i>
  <p class="mt-2 mb-1 fw-bold">拖拽或点击选择发票文件</p>
  <p class="text-muted small mb-0">支持 ZIP（单包最大 {{ invoice_limits.single_mb }}MB，含多层嵌套）、PDF、JPG、PNG · 可混合多选和继续追加</p>
  <input type="file" id="ipFileInput" multiple
         accept=".zip,.pdf,.jpg,.jpeg,.png,application/pdf,application/zip,image/jpeg,image/png" hidden>
</div>

<!-- 队列 -->
<div class="ip-queue hidden" id="ipQueue"></div>

<!-- 操作按钮 -->
<div class="ip-actions hidden" id="ipActions">
  <button type="button" class="btn btn-primary" id="ipStartBtn">
    <i class="bi bi-check-circle"></i> 提取并加入工作台
  </button>
  <button type="button" class="btn btn-outline-secondary btn-sm" id="ipClearQueueBtn">
    <i class="bi bi-trash"></i> 清空待处理
  </button>
  <span class="text-muted small" id="ipQueueCount"></span>
</div>

<!-- 进度 -->
<div class="ip-progress-wrap hidden" id="ipProgressWrap">
  <div class="ip-progress"><div class="ip-progress-bar" id="ipProgressBar"></div></div>
  <div class="ip-progress-text" id="ipProgressText"></div>
</div>

<!-- 压缩包错误需要持续显示，不能只依赖数秒后消失的 Toast -->
<div class="alert alert-warning mt-2 mb-0 hidden" id="ipArchiveErrors" role="alert" aria-live="polite">
  <strong>压缩包未处理完成</strong>
  <div class="small mt-1" id="ipArchiveErrorText"></div>
</div>

<!-- 结果面板 -->
<div id="ipResult" class="hidden"></div>

<!-- 空状态 -->
<div class="ip-empty" id="ipEmpty">
  <i class="bi bi-inbox"></i>
  <p>还没加入任何发票文件</p>
</div>

<!-- Toast -->
<div class="ip-toast" id="ipToast"></div>

<script>
// ============== 状态 ==============
const IP_LIMITS = {{ invoice_limits | tojson }};
const IP_ARCHIVES_PER_REQUEST = 2;
const IP_LOCAL_FILE_MAX_MB = 30;
const IP_MAX_QUEUE_FILES = 200;
const STATE = {
  queue: [],      // {file, name, size, sizeStr} — 待确认
  files: [],      // {name, size, sizeStr, type, _selected, dataUrl, blobUrl} — 已确认
  busy: false,
};
let queueSerial = 0;

// 支持的图片 MIME → 扩展名映射
const IMG_MIME = { 'image/jpeg': 1, 'image/png': 1 };
const IMG_EXT = new Set(['.jpg','.jpeg','.png']);

function isImageType(file) {
  return IMG_MIME[file.type] || IMG_EXT.has('.' + (file.name.split('.').pop() || '').toLowerCase());
}
function isPDFType(file) {
  return file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
}
function isZipType(file) {
  return file.type === 'application/zip' || file.type === 'application/x-zip-compressed' || file.name.toLowerCase().endsWith('.zip');
}
function escapeHTML(value) {
  return String(value || '').replace(/[&<>'"]/g, ch => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
  })[ch]);
}

// ============== 事件绑定 ==============
document.addEventListener('DOMContentLoaded', () => {
  const zone = document.getElementById('ipUploadZone');
  const input = document.getElementById('ipFileInput');
  const queue = document.getElementById('ipQueue');
  const result = document.getElementById('ipResult');
  zone.addEventListener('click', () => input.click());
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('dragover'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
  zone.addEventListener('drop', e => {
    e.preventDefault(); zone.classList.remove('dragover');
    addToQueue(e.dataTransfer.files);
  });
  input.addEventListener('change', () => { addToQueue(input.files); input.value = ''; });
  document.getElementById('ipStartBtn').addEventListener('click', event => processFiles(event.currentTarget));
  document.getElementById('ipClearQueueBtn').addEventListener('click', clearPendingQueue);

  queue.addEventListener('click', event => {
    const button = event.target.closest('[data-remove-queue-id]');
    if (!button) return;
    removeFromQueue(button.dataset.removeQueueId);
  });

  result.addEventListener('click', event => {
    const button = event.target.closest('[data-action]');
    if (!button) return;
    const index = Number(button.dataset.index);
    const actions = {
      'clear-all': clearAll,
      'delete-selected': deleteSelected,
      'print-all': printAll,
      'export-zip': exportZip,
      'print-one': () => printOne(index),
      'download-one': () => downloadOne(index),
      'remove-file': () => removeFile(index),
    };
    actions[button.dataset.action]?.();
  });

  result.addEventListener('change', event => {
    if (event.target.matches('[data-action="toggle-all"]')) toggleAll(event.target);
    if (event.target.matches('[data-action="toggle-file"]')) {
      onToggle(Number(event.target.dataset.index), event.target.checked);
    }
  });
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') hideToast();
});

// ============== Toast ==============
function showToast(msg, type) {
  type = type || 'info';
  const el = document.getElementById('ipToast');
  el.textContent = msg;
  el.className = 'ip-toast show ' + type;
  clearTimeout(el._tid);
  el._tid = setTimeout(hideToast, 4000);
}
function hideToast() {
  const el = document.getElementById('ipToast');
  el.classList.remove('show');
}

function showArchiveErrors(messages) {
  const panel = document.getElementById('ipArchiveErrors');
  const text = document.getElementById('ipArchiveErrorText');
  const unique = [...new Set(messages.filter(Boolean))];
  if (unique.length === 0) {
    panel.classList.add('hidden');
    text.textContent = '';
    return;
  }
  text.textContent = unique.join('；');
  panel.classList.remove('hidden');
}

function clearArchiveErrors() {
  showArchiveErrors([]);
}

// ============== 队列管理 ==============
function addToQueue(files) {
  if (STATE.busy) {
    showToast('正在处理当前清单，请稍候再添加文件', 'warn');
    return;
  }
  let added = 0;
  let unsupported = 0;
  let oversize = 0;
  const queuedKeys = new Set(STATE.queue.map(item => fileIdentity(item.file)));
  const existingKeys = new Set(STATE.files.map(item => item.key));
  for (const f of files) {
    if (!f || !f.name || f.size === 0) continue;
    if (!isZipType(f) && !isPDFType(f) && !isImageType(f)) { unsupported++; continue; }
    if (STATE.queue.length >= IP_MAX_QUEUE_FILES) break;
    // ZIP 受服务端安全门限约束；本地 PDF/图片只受浏览器内存门限约束。
    const maxMB = isZipType(f) ? IP_LIMITS.single_mb : IP_LOCAL_FILE_MAX_MB;
    if (f.size > maxMB * 1024 * 1024) {
      oversize++;
      continue;
    }
    const identity = fileIdentity(f);
    if (queuedKeys.has(identity) || existingKeys.has(identity)) continue;
    STATE.queue.push({
      id: `queue-${Date.now()}-${queueSerial++}`,
      file: f,
      name: f.name,
      size: f.size,
      sizeStr: formatSize(f.size),
    });
    queuedKeys.add(identity);
    added++;
  }
  if (added > 0) renderQueue();
  const warnings = [];
  if (unsupported) warnings.push(`${unsupported} 个不支持的文件（仅支持 ZIP/PDF/JPG/PNG）`);
  if (oversize) warnings.push(`${oversize} 个文件超过大小上限`);
  if (STATE.queue.length >= IP_MAX_QUEUE_FILES) warnings.push(`待处理文件最多 ${IP_MAX_QUEUE_FILES} 个`);
  if (warnings.length) showToast(warnings.join('；'), 'warn');
}

function fileIdentity(file) {
  if (file._invoiceKey) return file._invoiceKey;
  return `local:${file.name}:${file.size}:${file.lastModified || 0}`;
}

function removeFromQueue(queueId) {
  if (STATE.busy) return;
  const index = STATE.queue.findIndex(item => item.id === queueId);
  if (index < 0) return;
  STATE.queue.splice(index, 1);
  renderQueue();
  showToast('已从待处理清单移除', 'info');
}

function clearPendingQueue() {
  if (STATE.busy) return;
  const removed = STATE.queue.length;
  if (removed === 0) {
    document.getElementById('ipQueue').innerHTML = '';
    document.getElementById('ipFileInput').value = '';
    clearArchiveErrors();
    renderQueue();
    return;
  }
  STATE.queue = [];
  document.getElementById('ipFileInput').value = '';
  clearArchiveErrors();
  renderQueue();
  showToast(`已清空 ${removed} 个待处理文件`, 'info');
}

function clearAll() {
  if (STATE.busy || PRINTING) {
    showToast('正在处理文件，请稍候再清空', 'warn');
    return;
  }
  const hasFiles = STATE.files.length > 0;
  const hasQueue = STATE.queue.length > 0;
  if (!hasFiles && !hasQueue) return;
  // 先释放所有 Blob
  const removed = STATE.files.length + STATE.queue.length;
  revokeAllBlobs();
  STATE.files = [];
  STATE.queue = [];
  clearArchiveErrors();
  hideResultPanel();
  renderQueue();
  hideProgress();
  showToast(`已清空 ${removed} 个文件`, 'info');
}

function hideResultPanel() {
  document.getElementById('ipResult').classList.add('hidden');
  document.getElementById('ipResult').innerHTML = '';
  document.getElementById('ipEmpty').classList.remove('hidden');
}

function revokeAllBlobs() {
  STATE.files.forEach(f => { if (f.blobUrl) { URL.revokeObjectURL(f.blobUrl); f.blobUrl = null; } });
}

function renderQueue() {
  const el = document.getElementById('ipQueue');
  const actions = document.getElementById('ipActions');
  const countEl = document.getElementById('ipQueueCount');
  const resultVisible = !document.getElementById('ipResult').classList.contains('hidden');

  if (STATE.queue.length === 0) {
    el.innerHTML = '';
    countEl.textContent = '0 个文件';
    el.classList.add('hidden');
    actions.classList.add('hidden');
    // 只在结果面板也没内容时才展示空状态，避免两层重叠
    if (!resultVisible) document.getElementById('ipEmpty').classList.remove('hidden');
    return;
  }
  el.classList.remove('hidden');
  actions.classList.remove('hidden');
  document.getElementById('ipEmpty').classList.add('hidden');

  const totalSize = STATE.queue.reduce((s, q) => s + q.size, 0);
  countEl.textContent = `${STATE.queue.length} 个文件，共 ${formatSize(totalSize)}`;

  el.innerHTML = STATE.queue.map(q => {
    const icon = isZipType(q.file) ? 'bi-file-zip text-primary' : (isPDFType(q.file) ? 'bi-file-pdf text-danger' : 'bi-file-image text-warning');
    const safeName = escapeHTML(q.name);
    return `
    <div class="ip-queue-item">
      <span class="ip-q-icon"><i class="bi ${icon}"></i></span>
      <span class="ip-q-main">
        <span class="ip-q-name" title="${safeName}">${safeName}</span>
        ${q.error ? `<span class="ip-q-error">${escapeHTML(q.error)}</span>` : ''}
      </span>
      <span class="ip-q-size">${q.sizeStr}</span>
      <button type="button" class="ip-q-del" data-remove-queue-id="${escapeHTML(q.id)}" title="移除 ${safeName}" aria-label="移除 ${safeName}">&times;</button>
    </div>`;
  }).join('');
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/(1024*1024)).toFixed(1) + ' MB';
}

// ============== 确认文件 → 生成缩略图 ==============
async function processFiles(btn) {
  if (STATE.busy || STATE.queue.length === 0) return;

  STATE.busy = true;
  btn.disabled = true;
  document.getElementById('ipClearQueueBtn').disabled = true;
  document.getElementById('ipQueue').setAttribute('aria-busy', 'true');
  btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>提取并处理中…';
  clearArchiveErrors();

  const pending = [...STATE.queue];
  const archives = pending.filter(q => isZipType(q.file));
  const localFiles = pending.filter(q => !isZipType(q.file)).map(q => q.file);
  showProgress(0, archives.length ? `准备提取 ${archives.length} 个压缩包…` : '准备文件…');
  try {
    const archiveResult = archives.length
      ? await extractArchives(archives)
      : { files: [], failedItems: [], warnings: [] };
    const extractedFiles = archiveResult.files;
    const filesToAdd = [...localFiles, ...extractedFiles];
    const existing = new Set(STATE.files.map(f => f.key));
    let added = 0;

    for (let i = 0; i < filesToAdd.length; i++) {
      const file = filesToAdd[i];
      const dedupeKey = fileIdentity(file);
      if (existing.has(dedupeKey)) continue;
      existing.add(dedupeKey);
      const entry = {
        name: file.name,
        size: file.size,
        sizeStr: formatSize(file.size),
        key: dedupeKey,
        type: isPDFType(file) ? 'pdf' : (isImageType(file) ? 'image' : 'unknown'),
        source: file._invoiceSource || '',
        _selected: true,
        dataUrl: null,
        blobUrl: null,
      };

      if (entry.type === 'image') {
        // 生成缩略图 dataURL + 保存完整文件 blobUrl
        const blobUrl = URL.createObjectURL(file);
        entry.blobUrl = blobUrl;
        try {
          entry.dataUrl = await generateThumbnail(file, 112, 152);
        } catch (_) {
          entry.dataUrl = null;
        }
      } else {
        // PDF：直接存 blobUrl
        entry.blobUrl = URL.createObjectURL(file);
      }

      STATE.files.push(entry);
      added++;
      showProgress(Math.round((i + 1) / Math.max(filesToAdd.length, 1) * 100), `加入工作台 ${i + 1}/${filesToAdd.length}`);
    }

    STATE.queue = archiveResult.failedItems;
    if (STATE.files.length > 0) renderResult();
    renderQueue();
    if (archiveResult.warnings.length) {
      const prefix = added > 0 ? `已加入 ${added} 个发票文件；` : '';
      showArchiveErrors(archiveResult.warnings);
      showToast(prefix + archiveResult.warnings.join('；'), 'warn');
    } else if (added > 0) {
      clearArchiveErrors();
      showToast(`已加入 ${added} 个发票文件`, 'info');
    }
    if (STATE.files.length === 0 && STATE.queue.length === 0) {
      throw new Error('没有找到可用的 PDF 或图片发票');
    }
  } catch (e) {
    showToast('处理失败：' + e.message, 'warn');
  } finally {
    STATE.busy = false;
    btn.disabled = false;
    document.getElementById('ipClearQueueBtn').disabled = false;
    document.getElementById('ipQueue').removeAttribute('aria-busy');
    btn.innerHTML = '<i class="bi bi-check-circle"></i> 提取并加入工作台';
    hideProgress();
  }
}

function planArchiveBatches(queue) {
  const batches = [];
  let current = [];
  let bytes = 0;
  for (const item of queue) {
    if (current.length && (
      bytes + item.size > IP_LIMITS.batch_bytes ||
      current.length >= IP_ARCHIVES_PER_REQUEST
    )) {
      batches.push(current);
      current = [];
      bytes = 0;
    }
    current.push(item);
    bytes += item.size;
  }
  if (current.length) batches.push(current);
  return batches;
}

async function extractArchives(queue) {
  const batches = planArchiveBatches(queue);
  const extracted = [];
  const failedById = new Map();
  const warnings = [];

  const keepFailed = (item, message) => {
    failedById.set(item.id, { ...item, error: message });
  };

  const acceptResponse = (batch, data, label) => {
    const returnedFiles = Array.isArray(data.files) ? data.files : [];
    for (const item of returnedFiles) extracted.push(base64PDFToFile(item));

    const archiveResults = Array.isArray(data.archive_results) ? data.archive_results : null;
    if (archiveResults) {
      batch.forEach((item, index) => {
        const result = archiveResults[index];
        if (!result || result.skipped || result.error || Number(result.pdf_count || 0) === 0) {
          const issueText = Array.isArray(result?.issues) ? result.issues.join('；') : '';
          const reason = issueText || (result?.skipped
            ? '服务器因大小限制跳过，请检查上传门限'
            : (result?.error ? '压缩包读取失败或格式不受支持' : '压缩包内未找到 PDF'));
          keepFailed(item, reason);
        }
      });
    } else if (returnedFiles.length === 0) {
      batch.forEach(item => keepFailed(item, '服务器未返回 PDF'));
    }

    if (data.truncated) warnings.push(`${label}有 ${data.truncated_count || 0} 个 PDF 因响应上限未加入`);
    if (data.skipped_oversize?.length) {
      const skippedNames = data.skipped_oversize.map(message => String(message).split('（', 1)[0]);
      batch.filter(item => skippedNames.includes(item.name)).forEach(item => {
        keepFailed(item, '压缩包超过服务器上传门限');
      });
    }
  };

  for (let batchIndex = 0; batchIndex < batches.length; batchIndex++) {
    const batch = batches[batchIndex];
    try {
      showProgress(Math.round(batchIndex / batches.length * 45), `提取压缩包 ${batchIndex + 1}/${batches.length}…`);
      const data = await requestArchiveBatch(batch);
      acceptResponse(batch, data, `第 ${batchIndex + 1} 批`);
    } catch (error) {
      // 网关可能仍使用旧的请求体门限。整批失败时逐包重试，至少不让
      // 小压缩包被同批的大压缩包连带阻断。
      if (batch.length > 1 && (!error.status || [413, 502, 504].includes(error.status))) {
        warnings.push(`第 ${batchIndex + 1} 批被上传网关拒绝，已自动逐包重试`);
        for (let itemIndex = 0; itemIndex < batch.length; itemIndex++) {
          const item = batch[itemIndex];
          try {
            showProgress(
              Math.round((batchIndex + (itemIndex + 1) / batch.length) / batches.length * 45),
              `逐包重试 ${itemIndex + 1}/${batch.length}：${item.name}`
            );
            const data = await requestArchiveBatch([item]);
            acceptResponse([item], data, item.name);
          } catch (singleError) {
            const reason = archiveRequestErrorMessage(singleError, item);
            keepFailed(item, reason);
            warnings.push(`${item.name}：${reason}`);
          }
        }
      } else {
        const diagnosticResults = Array.isArray(error?.data?.archive_results)
          ? error.data.archive_results
          : null;
        if (diagnosticResults?.length === batch.length) {
          batch.forEach((item, index) => {
            const issues = diagnosticResults[index]?.issues || [];
            const reason = issues.length ? issues.join('；') : archiveRequestErrorMessage(error, item);
            keepFailed(item, reason);
            warnings.push(`${item.name}：${reason}`);
          });
        } else {
          const reason = archiveRequestErrorMessage(error, batch[0]);
          batch.forEach(item => keepFailed(item, reason));
          warnings.push(`第 ${batchIndex + 1} 批提取失败：${reason}`);
        }
      }
    }
  }
  for (const item of failedById.values()) {
    if (!warnings.some(message => message.includes(item.name))) {
      warnings.push(`${item.name}：${item.error}`);
    }
  }
  return { files: extracted, failedItems: [...failedById.values()], warnings };
}

async function requestArchiveBatch(batch) {
  const form = new FormData();
  batch.forEach(item => form.append('files', item.file, item.name));
  const csrfToken = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || '';
  const response = await fetch('/tools/invoice-printer/analyze', {
    method: 'POST', body: form, headers: {
      'X-CSRFToken': csrfToken,
      'Accept': 'application/json',
    }
  });
  const data = await response.json().catch(() => null);
  if (!response.ok || !data?.success) {
    const error = new Error(data?.error || `HTTP ${response.status}`);
    error.status = response.status;
    error.data = data;
    throw error;
  }
  return data;
}

function archiveRequestErrorMessage(error, item) {
  if (error?.status === 413) {
    return `${item?.sizeStr || '该文件'} 超过当前网站入口的上传限制，请检查实际使用的 Cloudflare、Caddy 或 Nginx 请求体门限`;
  }
  if (error?.data?.error) {
    const details = Array.isArray(error.data.archive_results)
      ? error.data.archive_results.flatMap(result => result.issues || []).join('；')
      : '';
    return details ? `${error.data.error}（${details}）` : error.data.error;
  }
  if (error?.status === 403 || error?.status === 400) {
    return `请求校验失败（HTTP ${error.status}），请刷新页面后重试`;
  }
  if (error?.status === 502 || error?.status === 504) {
    return `解压服务暂时不可用（HTTP ${error.status}），请稍后重试`;
  }
  if (error?.status === 524) {
    return '网站入口等待解压结果超时（HTTP 524）；服务器可能仍在处理，已停止自动重试以避免重复解压，请稍后再次处理保留的文件';
  }
  return error?.message || '未知错误';
}

function base64PDFToFile(item) {
  const binary = atob(item.data_b64 || '');
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  const file = new File([bytes], item.filename || 'invoice.pdf', { type: 'application/pdf' });
  file._invoiceKey = item.content_hash ? `sha256:${item.content_hash}` : `extracted:${item.filename}:${item.size || bytes.length}`;
  file._invoiceSource = (item.path_chain || []).join(' / ');
  return file;
}

function generateThumbnail(file, maxW, maxH) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const canvas = document.createElement('canvas');
      let w = img.width, h = img.height;
      const scale = Math.min(maxW / w, maxH / h, 1);
      canvas.width = Math.round(w * scale);
      canvas.height = Math.round(h * scale);
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      resolve(canvas.toDataURL('image/jpeg', 0.7));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('load failed')); };
    img.src = url;
  });
}

// ============== 打印引擎 ==============
// 批量打印采用 pdf-lib（CDN）将选中的 PDF + 图片合并为一份 PDF，
// 然后一次性 window.print() — 用户只需点一次"打印"按钮。

/** 懒加载 pdf-lib CDN（~400KB，仅在首次批量打印时加载） */
let _pdfLibReady = null;
function ensurePdfLib() {
  if (_pdfLibReady) return _pdfLibReady;
  _pdfLibReady = new Promise((resolve, reject) => {
    if (typeof PDFLib !== 'undefined') { resolve(PDFLib); return; }
    const s = document.createElement('script');
    s.src = 'https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js';
    s.onload = () => resolve(window.PDFLib);
    s.onerror = () => reject(new Error('pdf-lib 加载失败，请检查网络'));
    document.head.appendChild(s);
  });
  return _pdfLibReady.catch(error => {
    _pdfLibReady = null;
    throw error;
  });
}

/** 根据文件名后缀判断图片 MIME（用于 pdf-lib embedJpg / embedPng） */
function guessImageFormat(name) {
  const ext = (name.split('.').pop() || '').toLowerCase();
  return ext === 'png' ? 'png' : 'jpg';  // pdf-lib 只支持 jpg/png
}

/**
 * 将所有选中的 PDF + 图片合并为一份 PDF（客户端内存完成）。
 * 进度回调：({step, current, total}) => {}
 */
async function mergeIntoOnePDF(selectedFiles, onProgress) {
  const PDFLib = await ensurePdfLib();
  const { PDFDocument, PageSizes } = PDFLib;
  const merged = await PDFDocument.create();
  const total = selectedFiles.length;

  // 先去重 — 收集所有 blob 字节避免重复 fetch（同名同大小用缓存）
  const blobCache = new Map();

  for (let i = 0; i < selectedFiles.length; i++) {
    const f = selectedFiles[i];
    onProgress({ step: 'processing', current: i + 1, total, name: f.name });

    try {
      const cacheKey = f.name + '|' + f.size;
      let arrayBuf;
      if (blobCache.has(cacheKey)) {
        arrayBuf = blobCache.get(cacheKey);
      } else {
        const resp = await fetch(f.blobUrl);
        arrayBuf = await resp.arrayBuffer();
        blobCache.set(cacheKey, arrayBuf);
      }

      if (f.type === 'pdf') {
        onProgress({ step: 'merging_pdf', current: i + 1, total, name: f.name });
        const srcDoc = await PDFDocument.load(arrayBuf);
        const pageCount = srcDoc.getPageCount();
        if (pageCount === 0) continue;
        const pages = await merged.copyPages(srcDoc, srcDoc.getPageIndices());
        pages.forEach(p => merged.addPage(p));
      } else {
        onProgress({ step: 'embedding_image', current: i + 1, total, name: f.name });
        let image;
        const fmt = guessImageFormat(f.name);
        try {
          if (fmt === 'png') {
            image = await merged.embedPng(arrayBuf);
          } else {
            image = await merged.embedJpg(arrayBuf);
          }
        } catch (embedErr) {
          // 有时 MIME 和实际格式不匹配，换一种试试
          try {
            image = fmt === 'png'
              ? await merged.embedJpg(arrayBuf)
              : await merged.embedPng(arrayBuf);
          } catch (e2) {
            console.warn('无法嵌入图片:', f.name, embedErr, e2);
            continue;
          }
        }

        // 用图片原始尺寸建页，不超过 A4（595×842 point）
        const A4_W = PageSizes.A4[0];
        const A4_H = PageSizes.A4[1];
        let pw = image.width;
        let ph = image.height;

        // 超 A4 则等比缩放
        const scale = Math.min(1, A4_W / pw, A4_H / ph);
        pw = Math.round(pw * scale);
        ph = Math.round(ph * scale);

        const page = merged.addPage([pw, ph]);
        page.drawImage(image, { x: 0, y: 0, width: pw, height: ph });
      }
    } catch (e) {
      console.warn('合并失败:', f.name, e);
      onProgress({ step: 'skip', current: i + 1, total, name: f.name, error: e.message });
    }
  }

  onProgress({ step: 'saving', current: total, total });
  const bytes = await merged.save();
  return new Blob([bytes], { type: 'application/pdf' });
}

/** 单份打印（直接打开 PDF 或图片） */
function printOne(idx) {
  const f = STATE.files[idx];
  if (!f || !f.blobUrl) return;

}

/**
 * 批量一键打印：合并 → 一次 print 对话框
 * PDF + 图片 全部塞进一份 PDF，用户只点一次"打印"。
 */
async function printAll() {
  const selected = STATE.files.filter(f => !!f._selected);
  if (selected.length === 0) { showToast('没有选中的文件', 'warn'); return; }

  // 单个文件直接打
  if (selected.length === 1) {
    printOne(STATE.files.indexOf(selected[0]));
    return;
  }

  if (PRINTING) { showToast('正在处理中，请稍候…', 'warn'); return; }
  PRINTING = true;

  const summaryEl = document.getElementById('ipSummary');
  const origHTML = summaryEl ? summaryEl.innerHTML : '';

  try {
    // 先加载 pdf-lib（首次会并行 CDN 下载）
    setSummaryBusy('正在加载合并引擎…');
    await ensurePdfLib();

    // 合并
    const mergedBlob = await mergeIntoOnePDF(selected, (info) => {
      if (info.step === 'saving') {
        setSummaryBusy('正在保存合并文档…');
        showProgress(100, `正在保存合并文档…`);
      } else if (info.step === 'skip') {
        setSummaryBusy(`跳过 ${info.name}（${info.error}）`, 'warn');
      } else {
        const pct = Math.round(info.current / info.total * 90); // 留 10% 给 saving
        showProgress(pct, `合并中 ${info.current}/${info.total}: ${info.name}`);
        setSummaryBusy(`合并中 ${info.current}/${info.total}`);
      }
    });

    // 生成合并 PDF 的 Blob URL
    setSummaryBusy('正在准备打印…');
    showProgress(100, '正在打开打印对话框…');
    const url = URL.createObjectURL(mergedBlob);

    // 打开合并后的 PDF 打印页
    const win = window.open('', '_blank', 'width=900,height=700');
    if (!win) {
      showToast('浏览器拦截了弹出窗口，请允许弹出后重试', 'warn');
      URL.revokeObjectURL(url);
      return;
    }

    const safeUrl = url.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    win.document.write(`
      <!DOCTYPE html><html><head><title>发票批量打印 — 共 ${selected.length} 份</title><meta charset="utf-8"><style>
        *{margin:0;padding:0;}
        html,body{width:100%;height:100%;overflow:hidden;background:#525659;}
        embed{width:100%;height:100%;border:none;}
        @media print{html,body{background:#fff;} embed{width:100%;height:100%;}}
      </style></head><body>
      <embed src="${safeUrl}" type="application/pdf" width="100%" height="100%">
      <script>
        var printed=false;
        function doPrint(){if(!printed){printed=true;window.print();}}
        var e=document.querySelector('embed');
        if(e)e.addEventListener('load',function(){setTimeout(doPrint,800);});
        setTimeout(function(){if(!printed)doPrint();},4000);
      <\/script>
      </html>`);
    win.document.close();

    win.onafterprint = function () {
      win.close();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    };

    setSummaryBusy('已打开打印对话框 — 请点击打印', 'ok');
    setTimeout(restoreSummaryPanel, 3000);

  } catch (e) {
    showToast('合并失败: ' + (e.message || '未知错误'), 'warn');
    restoreSummaryPanel();
  } finally {
    PRINTING = false;
    hideProgress();
  }
}

// ============== 导出 ==============
function downloadOne(idx) {
  const f = STATE.files[idx];
  if (!f || !f.blobUrl) return;
  const a = document.createElement('a');
  a.href = f.blobUrl;
  a.download = f.name;
  a.click();

async function exportZip() {
  const selected = STATE.files.filter(f => !!f._selected);
  if (selected.length === 0) { showToast('没有选中的文件', 'warn'); return; }

  // 懒加载 JSZip；加载失败后给出可重试的明确提示。
  try {
    if (typeof JSZip === 'undefined') {
      await new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
        s.onload = resolve;
        s.onerror = () => reject(new Error('JSZip 加载失败，请检查网络后重试'));
        document.head.appendChild(s);
      });
    }
  } catch (error) {
    showToast(error.message, 'warn');
    return;
  }

  if (selected.length === 1) { downloadOne(STATE.files.indexOf(selected[0])); return; }

  showProgress(0, '打包中…');
  const zip = new JSZip();
  const names = {};
  const total = selected.length;

  for (let i = 0; i < selected.length; i++) {
    const f = selected[i];
    if (!f.blobUrl) continue;
    showProgress(Math.round((i + 1) / total * 100), `打包中 ${i + 1}/${total}`);
    try {
      const resp = await fetch(f.blobUrl);
      const blob = await resp.blob();
      let name = f.name;
      names[name] = (names[name] || 0) + 1;
      if (names[name] > 1) {
        const dot = name.lastIndexOf('.');
        name = dot > 0 ? name.slice(0, dot) + `_${names[name] - 1}` + name.slice(dot) : name + `_${names[name] - 1}`;
      }
      zip.file(name, blob);
    } catch (e) {
      console.warn('Failed to add', f.name, e);
    }
  }

  try {
    const zipBlob = await zip.generateAsync({ type: 'blob' });
    const url = URL.createObjectURL(zipBlob);
    const a = document.createElement('a');
    a.href = url; a.download = '发票文件.zip'; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    showToast(`已导出 ${selected.length} 个文件`, 'info');
  } catch (e) {
    showToast('打包失败: ' + e.message, 'warn');
  } finally {
    hideProgress();
  }
}

  document.querySelectorAll('.ip-card').forEach(el => el.classList.toggle('deselected', !cb.checked));

function onToggle(idx, checked) {
  if (!STATE.files[idx]) return;
  STATE.files[idx]._selected = checked;
  document.getElementById('ipCard' + idx)?.classList.toggle('deselected', !checked);
  const allCbs = document.querySelectorAll('.ip-cb');
  const allSel = document.getElementById('ipSelectAll');
  if (allSel) {
    allSel.checked = Array.from(allCbs).every(c => c.checked);
    allSel.indeterminate = Array.from(allCbs).some(c => c.checked) && !allSel.checked;
  }
  refreshSummary();
}

function deleteSelected() {
  const toDelete = STATE.files.filter(f => f._selected);
  if (toDelete.length === 0) { showToast('请先勾选要删除的文件', 'warn'); return; }
  toDelete.forEach(f => { if (f.blobUrl) { URL.revokeObjectURL(f.blobUrl); f.blobUrl = null; } });
  STATE.files = STATE.files.filter(f => !f._selected);

  if (STATE.files.length === 0) {
    hideResultPanel();
    renderQueue();
    showToast(`已删除 ${toDelete.length} 个文件`, 'info');
    return;
  }
  renderResult();
  showToast(`已删除 ${toDelete.length} 个文件`, 'info');
}

/** 单独删除一张卡片 */
function removeFile(idx) {
  const f = STATE.files[idx];
  if (!f) return;
  if (f.blobUrl) { URL.revokeObjectURL(f.blobUrl); f.blobUrl = null; }
  STATE.files.splice(idx, 1);
  if (STATE.files.length === 0) {
    hideResultPanel();
    renderQueue();
    showToast('已删除文件', 'info');
    return;
  }
  renderResult();
  showToast('已删除文件', 'info');
}

function refreshSummary() {
  const total = STATE.files.length;
  const selected = STATE.files.filter(f => f._selected).length;
  const badge = document.querySelector('#ipSummary .badge');
  if (badge) badge.textContent = `${selected}/${total} 个文件`;
}

// ============== 进度 ==============
let _hideProgressTimer = null;
function showProgress(pct, text) {
  clearTimeout(_hideProgressTimer);
  document.getElementById('ipProgressWrap').classList.remove('hidden');
  document.getElementById('ipProgressBar').style.width = pct + '%';
  document.getElementById('ipProgressText').textContent = text;
}
function hideProgress() {
  clearTimeout(_hideProgressTimer);
  _hideProgressTimer = setTimeout(() => {
    document.getElementById('ipProgressWrap').classList.add('hidden');
  }, 800);
}
</script>
