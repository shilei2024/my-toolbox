{% raw %}
<style>
:root {
  --ip-primary: #198754;
}

.ip-upload-zone {
  border: 2px dashed #adb5bd;
  border-radius: 0.5rem;
  padding: 2.2rem;
  text-align: center;
  cursor: pointer;
  transition: all 0.25s;
  background: #f8f9fa;
}
.ip-upload-zone:hover, .ip-upload-zone.dragover {
  border-color: var(--ip-primary);
  background: #eaf6ef;
}
.ip-upload-zone i { font-size: 2.3rem; color: var(--ip-primary); }

/* 队列 */
.ip-queue { margin-top: 0.75rem; }
.ip-queue-item {
  display: flex; align-items: center; gap: 0.5rem;
  padding: 0.35rem 0.55rem; background: #fff;
  border: 1px solid #dee2e6; border-radius: 0.35rem;
  margin-bottom: 0.3rem; font-size: 0.8rem;
}
.ip-queue-item .ip-q-icon { color: var(--ip-primary); font-size: 1rem; flex-shrink: 0; }
.ip-queue-item .ip-q-name { flex: 1; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ip-queue-item .ip-q-size { color: #6c757d; font-size: 0.72rem; flex-shrink: 0; }
.ip-queue-item .ip-q-del { flex-shrink: 0; cursor: pointer; color: #dc3545; font-size: 0.95rem; padding: 0 3px; }

.ip-actions { display: flex; gap: 0.5rem; align-items: center; margin-top: 0.75rem; flex-wrap: wrap; }

/* 结果面板 */
.ip-summary {
  display: flex; align-items: center; gap: 0.75rem;
  padding: 0.65rem 0.9rem; background: #f0f2f5;
  border-radius: 0.4rem; margin: 1rem 0; font-size: 0.82rem;
  flex-wrap: wrap;
}
.ip-summary .badge { font-size: 0.75rem; }

.ip-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 0.5rem;
  max-height: 60vh; overflow-y: auto; margin-top: 0.5rem;
}
.ip-card {
  display: flex; align-items: flex-start; gap: 0.55rem;
  padding: 0.5rem 0.65rem; background: #fff;
  border: 1px solid #dee2e6; border-radius: 0.4rem;
  font-size: 0.8rem; transition: all 0.15s;
  position: relative;
}
.ip-card:hover { background: #f8f9fa; border-color: #adb5bd; }
.ip-card.deselected { opacity: 0.4; background: #f8f9fa; }

/* 缩略图 */
.ip-thumb {
  width: 56px; height: 76px; flex-shrink: 0;
  border: 1px solid #dee2e6; border-radius: 3px;
  overflow: hidden; display: flex; align-items: center; justify-content: center;
  background: #f8f9fa; color: #adb5bd;
}
.ip-thumb img { width: 100%; height: 100%; object-fit: contain; }
.ip-thumb .ip-thumb-icon { font-size: 2rem; }
.ip-thumb .ip-thumb-icon.pdf { color: #dc3545; }
.ip-thumb .ip-thumb-icon.img { color: #fd7e14; }

.ip-card .ip-cb { flex-shrink: 0; width: 15px; height: 15px; cursor: pointer; accent-color: var(--ip-primary); margin-top: 2px; }
.ip-card .ip-info { flex: 1; overflow: hidden; min-width: 0; }
.ip-card .ip-name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ip-card .ip-meta { font-size: 0.7rem; color: #6c757d; margin-top: 1px; }
.ip-card .ip-btns { display: flex; gap: 3px; flex-shrink: 0; }
.ip-card .ip-btns .btn { font-size: 0.7rem; padding: 2px 7px; line-height: 1.4; }

.ip-empty {
  text-align: center; padding: 3rem 1rem; color: #adb5bd;
}
.ip-empty i { font-size: 3rem; display: block; margin-bottom: 0.5rem; }

/* 进度 */
.ip-progress-wrap { width: 100%; margin-top: 0.5rem; }
.ip-progress { height: 5px; background: #e9ecef; border-radius: 3px; overflow: hidden; }
.ip-progress-bar { height: 100%; background: var(--ip-primary); width: 0%; transition: width 0.3s ease; }
.ip-progress-text { font-size: 0.75rem; color: #6c757d; margin-top: 0.2rem; }

/* 提示条 */
.ip-toast {
  position: fixed; top: 1rem; right: 1rem; z-index: 9999;
  padding: 0.6rem 1rem; border-radius: 0.35rem; font-size: 0.82rem;
  max-width: 360px; box-shadow: 0 4px 12px rgba(0,0,0,.15);
  display: none;
}
.ip-toast.show { display: block; }
.ip-toast.info { background: #cff4fc; color: #055160; border: 1px solid #b6effb; }
.ip-toast.warn { background: #fff3cd; color: #664d03; border: 1px solid #ffc107; }
</style>

<div class="mb-3">
  <h5><i class="bi bi-printer"></i> 批量发票打印</h5>
  <p class="text-muted small mb-0">
    上传发票文件（PDF / 图片），预览后一键打印或导出。所有处理在浏览器本地完成，不上传服务器。
  </p>
</div>

<!-- 上传区 -->
<div class="ip-upload-zone" id="ipUploadZone">
  <i class="bi bi-cloud-upload"></i>
  <p class="mt-2 mb-1 fw-bold">拖拽或点击选择发票文件</p>
  <p class="text-muted small mb-0">支持 PDF、JPG、PNG、TIFF、BMP · 支持多选 · 可继续追加</p>
  <input type="file" id="ipFileInput" multiple
         accept=".pdf,.jpg,.jpeg,.png,.tiff,.tif,.bmp,image/*" hidden>
</div>

<!-- 队列 -->
<div class="ip-queue hidden" id="ipQueue"></div>

<!-- 操作按钮 -->
<div class="ip-actions hidden" id="ipActions">
  <button class="btn btn-primary" id="ipStartBtn" onclick="processFiles(this)">
    <i class="bi bi-check-circle"></i> 确认文件
  </button>
  <button class="btn btn-outline-secondary btn-sm" onclick="clearAll()">
    <i class="bi bi-trash"></i> 清空
  </button>
  <span class="text-muted small" id="ipQueueCount"></span>
</div>

<!-- 进度 -->
<div class="ip-progress-wrap hidden" id="ipProgressWrap">
  <div class="ip-progress"><div class="ip-progress-bar" id="ipProgressBar"></div></div>
  <div class="ip-progress-text" id="ipProgressText"></div>
</div>

<!-- 结果面板 -->
<div id="ipResult" class="hidden"></div>

<!-- 空状态 -->
<div class="ip-empty" id="ipEmpty">
  <i class="bi bi-inbox"></i>
  <p>还没上传任何发票文件</p>
</div>

<!-- Toast -->
<div class="ip-toast" id="ipToast"></div>

<script>
// ============== 状态 ==============
const STATE = {
  queue: [],      // {file, name, size, sizeStr} — 待确认
  files: [],      // {name, size, sizeStr, type, _selected, dataUrl, blobUrl} — 已确认
};

// 支持的图片 MIME → 扩展名映射
const IMG_MIME = { 'image/jpeg': 1, 'image/png': 1, 'image/tiff': 1, 'image/bmp': 1, 'image/webp': 1, 'image/gif': 1 };
const IMG_EXT = new Set(['.jpg','.jpeg','.png','.tiff','.tif','.bmp','.webp','.gif']);

function isImageType(file) {
  return IMG_MIME[file.type] || IMG_EXT.has('.' + (file.name.split('.').pop() || '').toLowerCase());
}
function isPDFType(file) {
  return file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
}

// ============== 事件绑定 ==============
document.addEventListener('DOMContentLoaded', () => {
  const zone = document.getElementById('ipUploadZone');
  const input = document.getElementById('ipFileInput');
  zone.addEventListener('click', () => input.click());
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('dragover'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
  zone.addEventListener('drop', e => {
    e.preventDefault(); zone.classList.remove('dragover');
    addToQueue(e.dataTransfer.files);
  });
  input.addEventListener('change', () => { addToQueue(input.files); input.value = ''; });
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') hideToast();
});

// ============== Toast ==============
function showToast(msg, type) {
  type = type || 'info';
  const el = document.getElementById('ipToast');
  el.textContent = msg;
  el.className = 'ip-toast show ' + type;
  clearTimeout(el._tid);
  el._tid = setTimeout(hideToast, 4000);
}
function hideToast() {
  const el = document.getElementById('ipToast');
  el.classList.remove('show');
}

// ============== 队列管理 ==============
function addToQueue(files) {
  let added = 0;
  for (const f of files) {
    if (!f || !f.name || f.size === 0) continue;
    // 允许 PDF + 图片
    if (!isPDFType(f) && !isImageType(f)) continue;
    // 单文件 30MB 上限（浏览器内存友好）
    if (f.size > 30 * 1024 * 1024) {
      showToast(`跳过 ${f.name}：超过 30MB 上限`, 'warn');
      continue;
    }
    // 去重（同名 + 同大小）
    if (STATE.queue.some(q => q.name === f.name && q.size === f.size)) continue;
    STATE.queue.push({ file: f, name: f.name, size: f.size, sizeStr: formatSize(f.size) });
    added++;
  }
  if (added > 0) renderQueue();
}

function removeFromQueue(idx) {
  STATE.queue.splice(idx, 1);
  renderQueue();
}

function clearAll() {
  STATE.queue = [];
  STATE.files = [];
  revokeAllBlobs();
  renderQueue();
  document.getElementById('ipResult').classList.add('hidden');
  document.getElementById('ipEmpty').classList.remove('hidden');
}

function revokeAllBlobs() {
  STATE.files.forEach(f => { if (f.blobUrl) { URL.revokeObjectURL(f.blobUrl); f.blobUrl = null; } });
}

function renderQueue() {
  const el = document.getElementById('ipQueue');
  const actions = document.getElementById('ipActions');
  const countEl = document.getElementById('ipQueueCount');

  if (STATE.queue.length === 0) {
    el.classList.add('hidden');
    actions.classList.add('hidden');
    document.getElementById('ipEmpty').classList.remove('hidden');
    return;
  }
  el.classList.remove('hidden');
  actions.classList.remove('hidden');
  document.getElementById('ipEmpty').classList.add('hidden');

  const totalSize = STATE.queue.reduce((s, q) => s + q.size, 0);
  countEl.textContent = `${STATE.queue.length} 个文件，共 ${formatSize(totalSize)}`;

  el.innerHTML = STATE.queue.map((q, i) => {
    const icon = isPDFType(q.file) ? 'bi-file-pdf text-danger' : 'bi-file-image text-warning';
    return `
    <div class="ip-queue-item">
      <span class="ip-q-icon"><i class="bi ${icon}"></i></span>
      <span class="ip-q-name" title="${q.name}">${q.name}</span>
      <span class="ip-q-size">${q.sizeStr}</span>
      <span class="ip-q-del" onclick="removeFromQueue(${i})" title="移除">&times;</span>
    </div>`;
  }).join('');
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/(1024*1024)).toFixed(1) + ' MB';
}

// ============== 确认文件 → 生成缩略图 ==============
async function processFiles(btn) {
  if (STATE.queue.length === 0) return;

  revokeAllBlobs();
  STATE.files = [];
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>处理中…';

  const total = STATE.queue.length;
  showProgress(0, `处理中 0/${total}`);
  try {
    for (let i = 0; i < STATE.queue.length; i++) {
      const q = STATE.queue[i];
      const entry = {
        name: q.name,
        size: q.size,
        sizeStr: q.sizeStr,
        type: isPDFType(q.file) ? 'pdf' : (isImageType(q.file) ? 'image' : 'unknown'),
        _selected: true,
        dataUrl: null,
        blobUrl: null,
      };

      if (entry.type === 'image') {
        // 生成缩略图 dataURL + 保存完整文件 blobUrl
        const blobUrl = URL.createObjectURL(q.file);
        entry.blobUrl = blobUrl;
        try {
          entry.dataUrl = await generateThumbnail(q.file, 112, 152);
        } catch (_) {
          entry.dataUrl = null;
        }
      } else {
        // PDF：直接存 blobUrl
        entry.blobUrl = URL.createObjectURL(q.file);
      }

      STATE.files.push(entry);
      showProgress(Math.round((i + 1) / total * 100), `处理中 ${i + 1}/${total}`);
    }

    renderResult();
    STATE.queue = [];
    renderQueue();
  } catch (e) {
    showToast('处理失败：' + e.message, 'warn');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="bi bi-check-circle"></i> 确认文件';
    hideProgress();
  }
}

function generateThumbnail(file, maxW, maxH) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const canvas = document.createElement('canvas');
      let w = img.width, h = img.height;
      const scale = Math.min(maxW / w, maxH / h, 1);
      canvas.width = Math.round(w * scale);
      canvas.height = Math.round(h * scale);
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      resolve(canvas.toDataURL('image/jpeg', 0.7));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('load failed')); };
    img.src = url;
  });
}

// ============== 结果展示 ==============
function renderResult() {
  const el = document.getElementById('ipResult');
  const total = STATE.files.length;
  const selectedCount = STATE.files.filter(f => f._selected !== false).length;
  const totalSize = STATE.files.reduce((s, f) => s + f.size, 0);

  let html = `
    <div class="ip-summary" id="ipSummary">
      <span class="badge bg-success">${selectedCount}/${total} 个文件</span>
      <span class="text-muted">${formatSize(totalSize)}</span>
      <label class="ms-auto me-2 small" style="cursor:pointer;user-select:none;">
        <input type="checkbox" id="ipSelectAll" onchange="toggleAll(this)" checked
               style="accent-color:var(--ip-primary);"> 全选
      </label>
      <div class="btn-group btn-group-sm">
        <button class="btn btn-outline-danger" onclick="deleteSelected()" title="删除选中">
          <i class="bi bi-trash"></i>
        </button>
        <button class="btn btn-outline-primary" onclick="printAll()" title="批量自动打印">
          <i class="bi bi-printer"></i> 批量打印
        </button>
        <button class="btn btn-outline-success" onclick="exportZip()" title="导出 ZIP">
          <i class="bi bi-download"></i> 导出 ZIP
        </button>
      </div>
    </div>
    <div class="ip-grid">
  `;

  STATE.files.forEach((f, i) => {
    const checked = f._selected !== false ? 'checked' : '';
    const deselected = checked ? '' : ' deselected';
    const thumbHTML = f.dataUrl
      ? `<img src="${f.dataUrl}" alt="">`
      : `<i class="bi ${f.type === 'pdf' ? 'bi-file-pdf ip-thumb-icon pdf' : 'bi-file-image ip-thumb-icon img'}"></i>`;

    html += `
      <div class="ip-card${deselected}" id="ipCard${i}">
        <input type="checkbox" class="ip-cb" ${checked} onchange="onToggle(${i},this.checked)">
        <div class="ip-thumb">${thumbHTML}</div>
        <div class="ip-info">
          <div class="ip-name" title="${f.name}">${f.name}</div>
          <div class="ip-meta">${f.sizeStr}</div>
          <div class="ip-btns mt-1">
            <button class="btn btn-outline-secondary btn-sm" onclick="printOne(${i})" title="打印">
              <i class="bi bi-printer"></i> 打印
            </button>
            <button class="btn btn-outline-secondary btn-sm" onclick="downloadOne(${i})" title="下载">
              <i class="bi bi-download"></i>
            </button>
          </div>
        </div>
      </div>`;
  });

  html += '</div>';
  el.innerHTML = html;
  el.classList.remove('hidden');
  document.getElementById('ipEmpty').classList.add('hidden');
}

// ============== 打印引擎 ==============
// 打印排队控制器
const PRINT_Q = { running: false, idxs: [], cursor: 0, total: 0, skipNext: false };

function showPrintPanel() {
  // 把汇总栏变成打印进度栏
  const el = document.getElementById('ipSummary');
  if (!el) return;
  const cur = PRINT_Q.cursor;
  const total = PRINT_Q.total;

  if (PRINT_Q.running && total > 0) {
    el.className = 'ip-summary';
    el.style.background = '#eaf6ef';
    el.innerHTML = `
      <span class="badge bg-primary" id="ipPrintBadge">打印中 ${cur + 1}/${total}</span>
      <span class="text-muted small" id="ipPrintName"></span>
      <div class="ms-auto">
        <button class="btn btn-outline-warning btn-sm me-1" onclick="PRINT_Q.skipNext=true;showToast('即将跳过当前文件','warn')">
          <i class="bi bi-skip-forward"></i> 跳过
        </button>
        <button class="btn btn-outline-danger btn-sm" onclick="stopPrintQueue()">
          <i class="bi bi-stop-circle"></i> 停止
        </button>
      </div>`;
  }
}

function restoreSummaryPanel() {
  const el = document.getElementById('ipSummary');
  if (!el) return;
  const total = STATE.files.length;
  const selectedCount = STATE.files.filter(f => f._selected !== false).length;
  const totalSize = STATE.files.reduce((s, f) => s + f.size, 0);

  el.className = 'ip-summary';
  el.style.background = '';
  el.innerHTML = `
    <span class="badge bg-success">${selectedCount}/${total} 个文件</span>
    <span class="text-muted">${formatSize(totalSize)}</span>
    <label class="ms-auto me-2 small" style="cursor:pointer;user-select:none;">
      <input type="checkbox" id="ipSelectAll" onchange="toggleAll(this)" checked
             style="accent-color:var(--ip-primary);"> 全选
    </label>
    <div class="btn-group btn-group-sm">
      <button class="btn btn-outline-danger" onclick="deleteSelected()" title="删除选中">
        <i class="bi bi-trash"></i>
      </button>
      <button class="btn btn-outline-primary" onclick="printAll()" title="全部打印">
        <i class="bi bi-printer"></i> 全部打印
      </button>
      <button class="btn btn-outline-success" onclick="exportZip()" title="导出 ZIP">
        <i class="bi bi-download"></i> 导出 ZIP
      </button>
    </div>`;
}

/**
 * 核心：为单个文件打开打印窗口，自动触发打印。
 * PDF 用 <embed> 嵌入 PDF 查看器 + window.print() 一键打印；
 * 图片用 <img> + window.print()。
 * 返回打开的 window 引用，供 onafterprint 链式推进。
 */
function openPrintWindow(f) {
  const win = window.open('', '_blank', 'width=900,height=650');
  if (!win) return null;

  const escapedUrl = f.blobUrl.replace(/\\/g, '\\\\').replace(/'/g, "\\'");

  if (f.type === 'pdf') {
    win.document.write(`
      <!DOCTYPE html><html><head><title>${f.name}</title><meta charset="utf-8"><style>
        *{margin:0;padding:0;}
        html,body{width:100%;height:100%;overflow:hidden;background:#525659;}
        embed{width:100%;height:100%;border:none;}
        @media print{
          html,body{background:#fff;}
          embed{width:100%;height:100%;}
        }
      </style></head><body>
      <embed src="${escapedUrl}" type="application/pdf" width="100%" height="100%">
      <script>
        var printed=false;
        var embedEl=document.querySelector('embed');
        function doPrint(){
          if(printed)return;printed=true;
          window.print();
        }
        // PDF 嵌入加载完成后打印
        if(embedEl){
          embedEl.addEventListener('load',function(){setTimeout(doPrint,600);});
        }
        // 兜底：2秒后还没打印就强制触发
        setTimeout(function(){if(!printed)doPrint();},3000);
      <\/script>
      </html>`);
  } else {
    // 图片打印页
    win.document.write(`
      <!DOCTYPE html><html><head><title>${f.name}</title><meta charset="utf-8"><style>
        *{margin:0;padding:0;}
        body{display:flex;justify-content:center;align-items:center;min-height:100vh;background:#f5f5f5;}
        img{max-width:98vw;max-height:98vh;object-fit:contain;box-shadow:0 2px 12px rgba(0,0,0,.15);}
        @media print{
          body{background:#fff;}
          img{max-width:100%;max-height:100%;box-shadow:none;}
        }
      </style></head><body><img src="${escapedUrl}"></body>
      <script>
        window.onload=function(){setTimeout(function(){window.print();},400);};
      <\/script>
      </html>`);
  }
  win.document.close();
  return win;
}

/** 单份打印（手动触发） */
function printOne(idx) {
  const f = STATE.files[idx];
  if (!f || !f.blobUrl) return;

  const win = openPrintWindow(f);
  if (!win) { showToast('请允许弹出窗口以打印文件', 'warn'); return; }

  // 打印完成后自动关窗
  win.onafterprint = function () { win.close(); };
}

/** 停止打印队列 */
function stopPrintQueue() {
  PRINT_Q.running = false;
  PRINT_Q.idxs = [];
  PRINT_Q.cursor = 0;
  PRINT_Q.total = 0;
  restoreSummaryPanel();
  hideProgress();
  showToast('打印已停止', 'info');
}

/** 打印队列：播放下一个文件 */
function playNextInQueue() {
  // 上一轮想跳过？
  if (PRINT_Q.skipNext) { PRINT_Q.skipNext = false; }

  if (!PRINT_Q.running || PRINT_Q.cursor >= PRINT_Q.idxs.length) {
    // 全部打印完毕
    PRINT_Q.running = false;
    restoreSummaryPanel();
    hideProgress();
    showToast(`全部打印完成（${PRINT_Q.idxs.length} 个文件）`, 'info');
    return;
  }

  const idx = PRINT_Q.idxs[PRINT_Q.cursor];
  const f = STATE.files[idx];
  if (!f || !f.blobUrl) {
    PRINT_Q.cursor++;
    setTimeout(playNextInQueue, 200);
    return;
  }

  showPrintPanel();
  const nameEl = document.getElementById('ipPrintName');
  if (nameEl) nameEl.textContent = f.name;
  showProgress(
    Math.round(PRINT_Q.cursor / PRINT_Q.total * 100),
    `正在打印 ${PRINT_Q.cursor + 1}/${PRINT_Q.total}: ${f.name}`
  );

  const win = openPrintWindow(f);
  if (!win) {
    showToast(`跳过 ${f.name}：浏览器拦截了弹出窗口`, 'warn');
    PRINT_Q.cursor++;
    setTimeout(playNextInQueue, 500);
    return;
  }

  // 核心：打印对话框关闭后自动播下一个
  win.onafterprint = function () {
    win.close();
    PRINT_Q.cursor++;
    setTimeout(playNextInQueue, 400);
  };

  // 兜底：如果用户不关窗，30 秒后自动继续（避免卡死队列）
  const watch = setInterval(function () {
    if (win.closed) {
      clearInterval(watch);
    } else if (!PRINT_Q.running) {
      clearInterval(watch);
    }
  }, 2000);
  setTimeout(function () {
    clearInterval(watch);
    if (!win.closed && PRINT_Q.running) {
      // 超时未关闭，自动推进（不关窗，留给用户手动处理）
      PRINT_Q.cursor++;
      playNextInQueue();
    }
  }, 45000);
}

/** 批量打印：顺序排队，每个打印完自动播下一个 */
function printAll() {
  const selected = STATE.files.filter(f => f._selected !== false);
  if (selected.length === 0) { showToast('没有选中的文件', 'warn'); return; }

  if (selected.length === 1) {
    printOne(STATE.files.indexOf(selected[0]));
    return;
  }

  // 如果已经在打印中，询问是否重新开始
  if (PRINT_Q.running) {
    if (!confirm('打印队列正在运行，是否停止当前队列并重新开始？')) return;
    PRINT_Q.running = false;
  }

  if (!confirm(
    `即将自动依次打印 ${selected.length} 个文件。\n\n` +
    `每个文件会自动弹出打印对话框，打印/取消后自动继续下一个。\n` +
    `请允许浏览器弹出窗口。\n\n` +
    `可以随时点击「跳过」或「停止」。\n\n确认开始？`
  )) return;

  PRINT_Q.running = true;
  PRINT_Q.idxs = selected.map(f => STATE.files.indexOf(f));
  PRINT_Q.cursor = 0;
  PRINT_Q.total = selected.length;
  PRINT_Q.skipNext = false;

  showPrintPanel();
  playNextInQueue();
}

// ============== 导出 ==============
function downloadOne(idx) {
  const f = STATE.files[idx];
  if (!f || !f.blobUrl) return;
  const a = document.createElement('a');
  a.href = f.blobUrl;
  a.download = f.name;
  a.click();
}

async function exportZip() {
  const selected = STATE.files.filter(f => f._selected !== false);
  if (selected.length === 0) { showToast('没有选中的文件', 'warn'); return; }

  // 懒加载 JSZip
  if (typeof JSZip === 'undefined') {
    await new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
      s.onload = resolve;
      s.onerror = () => reject(new Error('JSZip 加载失败'));
      document.head.appendChild(s);
    });
  }

  if (selected.length === 1) { downloadOne(STATE.files.indexOf(selected[0])); return; }

  showProgress(0, '打包中…');
  const zip = new JSZip();
  const names = {};
  const total = selected.length;

  for (let i = 0; i < selected.length; i++) {
    const f = selected[i];
    if (!f.blobUrl) continue;
    showProgress(Math.round((i + 1) / total * 100), `打包中 ${i + 1}/${total}`);
    try {
      const resp = await fetch(f.blobUrl);
      const blob = await resp.blob();
      let name = f.name;
      names[name] = (names[name] || 0) + 1;
      if (names[name] > 1) {
        const dot = name.lastIndexOf('.');
        name = dot > 0 ? name.slice(0, dot) + `_${names[name] - 1}` + name.slice(dot) : name + `_${names[name] - 1}`;
      }
      zip.file(name, blob);
    } catch (e) {
      console.warn('Failed to add', f.name, e);
    }
  }

  try {
    const zipBlob = await zip.generateAsync({ type: 'blob' });
    const url = URL.createObjectURL(zipBlob);
    const a = document.createElement('a');
    a.href = url; a.download = '发票文件.zip'; a.click();
    URL.revokeObjectURL(url);
    showToast(`已导出 ${selected.length} 个文件`, 'info');
  } catch (e) {
    showToast('打包失败: ' + e.message, 'warn');
  } finally {
    hideProgress();
  }
}

// ============== 选择控制 ==============
function toggleAll(cb) {
  STATE.files.forEach(f => { f._selected = cb.checked; });
  document.querySelectorAll('.ip-cb').forEach(c => c.checked = cb.checked);
  document.querySelectorAll('.ip-card').forEach(el => el.classList.toggle('deselected', !cb.checked));
  refreshSummary();
}

function onToggle(idx, checked) {
  STATE.files[idx]._selected = checked;
  document.getElementById('ipCard' + idx)?.classList.toggle('deselected', !checked);
  const allCbs = document.querySelectorAll('.ip-cb');
  const allSel = document.getElementById('ipSelectAll');
  if (allSel) allSel.checked = Array.from(allCbs).every(c => c.checked);
  refreshSummary();
}

function deleteSelected() {
  const before = STATE.files.length;
  STATE.files = STATE.files.filter(f => f._selected !== false);
  const removed = before - STATE.files.length;
  if (removed === 0) { showToast('请先勾选要删除的文件', 'warn'); return; }
  if (!confirm(`确定删除 ${removed} 个文件吗？`)) return;
  renderResult();
}

function refreshSummary() {
  const total = STATE.files.length;
  const selected = STATE.files.filter(f => f._selected !== false).length;
  const badge = document.querySelector('.ip-summary .badge');
  if (badge) badge.textContent = `${selected}/${total} 个文件`;
}

// ============== 进度 ==============
function showProgress(pct, text) {
  document.getElementById('ipProgressWrap').classList.remove('hidden');
  document.getElementById('ipProgressBar').style.width = pct + '%';
  document.getElementById('ipProgressText').textContent = text;
}
function hideProgress() {
  setTimeout(() => {
    document.getElementById('ipProgressWrap').classList.add('hidden');
  }, 800);
}
</script>
