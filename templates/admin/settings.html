{% extends "admin/_base.html" %}
{% block admin_content %}
<h1 class="h3 mb-3"><i class="bi bi-gear"></i> 系统设置</h1>

<div class="row g-4">
  <div class="col-lg-7">
    <div class="card border-0 shadow-sm">
      <div class="card-body">
        <h5 class="mb-3"><i class="bi bi-sliders"></i> 站点与限额</h5>
        <form method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

          <div class="mb-3">
            <label class="form-label">新用户注册赠送积分</label>
            <input type="text" name="signup_credit_grant" class="form-control"
                   value="{{ stored.signup_credit_grant or config.SIGNUP_CREDIT_GRANT or '10' }}"/>
            <div class="form-text">新用户首次打开 AI 创作页时赠送的免费积分；0 表示不赠送。</div>
          </div>

          <div class="mb-3">
            <label class="form-label">网站名称</label>
            <input type="text" name="site_name" class="form-control"
                   value="{{ stored.site_name or config.SITE_NAME }}"/>
          </div>
          <div class="mb-3">
            <label class="form-label">首页标语</label>
            <textarea name="site_tagline" class="form-control" rows="2">{{ stored.site_tagline or config.SITE_TAGLINE }}</textarea>
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">注册用户每日免费次数</label>
              <input type="number" name="daily_free_limit" class="form-control" min="0" max="1000"
                     value="{{ stored.daily_free_limit or config.DAILY_FREE_LIMIT }}"/>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">匿名用户每工具总次数</label>
              <input type="number" name="anon_free_limit" class="form-control" min="0" max="100"
                     value="{{ stored.anon_free_limit or config.ANON_FREE_LIMIT }}"/>
            </div>
          </div>

          <button class="btn btn-primary"><i class="bi bi-check-lg"></i> 保存设置</button>
          <div class="form-text mt-2">保存后立即同步到首页、页面标题和免费次数校验，无需重启服务。</div>
        </form>
      </div>
    </div>
  </div>

  <div class="col-lg-5">
    <div class="card border-0 shadow-sm mb-3">
      <div class="card-body">
        <h6 class="text-muted text-uppercase small">当前生效配置</h6>
        <table class="table table-sm mb-0">
          <tr><td>网站名称</td><td><code>{{ config.SITE_NAME }}</code></td></tr>
          <tr><td>注册用户限额</td><td><code>{{ config.DAILY_FREE_LIMIT }}</code></td></tr>
          <tr><td>匿名用户限额</td><td><code>{{ config.ANON_FREE_LIMIT }}</code></td></tr>
        </table>
      </div>
    </div>
  </div>
</div>
{% endblock %}
