name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements.txt
          python -m pip check
      - name: Run Python test suite
        env:
          VERCEL: "1"
          SECRET_KEY: ci-only-secret-not-for-production
          ADMIN_EMAIL: ci-admin@example.test
          ADMIN_PASSWORD: ci-only-password
        run: python -m unittest discover --start-directory tests --pattern "test_*.py"

  generation-service:
    name: Generation Service
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/generation-service
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: services/generation-service/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Run unit and contract tests
        run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  gallery-web:
    name: Gallery Web
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/gallery-web
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: apps/gallery-web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Run SEO tests
        run: npm run test:seo
      - name: Build production bundle
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  postgres-integration:
    name: PostgreSQL integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: mindfulpenpal_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d mindfulpenpal_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGPASSWORD: ci-password
      TEST_DATABASE_URL: postgresql://ci:ci-password@127.0.0.1:5432/mindfulpenpal_ci
      PHASE6_TEST_DATABASE_URL: postgresql://ci:ci-password@127.0.0.1:5432/mindfulpenpal_ci
      PHASE7_TEST_DATABASE_URL: postgresql://ci:ci-password@127.0.0.1:5432/mindfulpenpal_ci
      PHASE8_TEST_DATABASE_URL: postgresql://ci:ci-password@127.0.0.1:5432/mindfulpenpal_ci
      PHASE9_TEST_DATABASE_URL: postgresql://ci:ci-password@127.0.0.1:5432/mindfulpenpal_ci
      PHASE10_TEST_DATABASE_URL: postgresql://ci:ci-password@127.0.0.1:5432/mindfulpenpal_ci
    defaults:
      run:
        working-directory: services/generation-service
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: services/generation-service/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Create host user compatibility table
        run: >-
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1
          -c "CREATE TABLE public.users (id integer PRIMARY KEY, email text NOT NULL UNIQUE);"
      - name: Apply all database migrations
        run: |
          for migration in database/migrations/*.sql; do
            echo "Applying ${migration}"
            psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "${migration}"
          done
      - name: Run PostgreSQL integration suites
        run: |
          npm run test:phase6:pg
          npm run test:phase7:pg
          npm run test:phase8:pg
          npm run test:phase9:pg
          npm run test:phase10:pg
